plugins { id 'com.android.application' }

android {
    namespace 'com.projectjhs.whileclimbing'
    compileSdk 36

    defaultConfig {
        applicationId "com.projectjhs.whileclimbing"
        minSdk 24            // 안드로이드 7.0. 이 아래는 WebView 가 너무 낡았습니다
        targetSdk 36         // 스토어가 요구하는 값은 해마다 오릅니다 — 콘솔에서 확인하세요
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // 게임 코드는 전부 WebView 안(assets/game.html)이라 줄일 것이 거의
            // 없습니다. 켜 두는 까닭은 Play Games SDK 쪽을 줄이기 위해서입니다.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 서명은 사장님 컴퓨터에서 붙입니다 (android/README.md 참고).
            // 여기에 키를 적지 마세요 — 저장소에 들어갑니다.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // ── 코틀린 표준 라이브러리가 두 번 들어오는 것 막기 ────────
    //
    // 첫 빌드가 여기서 멈췄습니다:
    //
    //     Duplicate class kotlin.collections.jdk8.CollectionsJDK8Kt
    //     found in modules kotlin-stdlib-1.8.22.jar -> kotlin-stdlib-jdk8-...
    //
    // 코틀린 1.8 부터 kotlin-stdlib-jdk7 · jdk8 의 알맹이가 본체
    // (kotlin-stdlib) 안으로 합쳐졌습니다. 그런데 딸려 오는 라이브러리
    // 중에 아직 옛 판 jdk7/jdk8 을 달고 오는 것이 있어서, 같은 클래스가
    // 두 군데서 들어옵니다.
    //
    // 옛 판을 **본체와 같은 판번호로 끌어올리면** 그 둘은 빈 껍데기가
    // 되어 겹치지 않습니다. 지우는 게 아니라 올리는 것이라, 그것을 쓰는
    // 라이브러리도 그대로 돕니다. (코틀린 쪽이 권하는 방법입니다.)
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because '코틀린 1.8 부터 본체에 합쳐졌습니다 — 옛 판이 섞이면 클래스가 겹칩니다'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because '위와 같습니다'
        }
    }

    implementation 'androidx.appcompat:appcompat:1.7.0'
    // 순위표와 업적. 콘솔 등록이 끝나기 전에는 로그인만 실패하고 게임은
    // 그대로 돕니다 (GamesBridge 가 조용히 거짓을 돌려줍니다).
    implementation 'com.google.android.gms:play-services-games-v2:20.1.2'
}
