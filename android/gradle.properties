org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=true

# compileSdk 36 인데 AGP 는 8.7.3 입니다. AGP 는 자기가 시험해 본 판번호
# (8.7.3 은 35 까지)보다 높은 compileSdk 를 보면 걸고 넘어집니다 —
# 「We recommend using a newer Android Gradle plugin to use compileSdk = 36」.
#
# targetSdk 는 내릴 수 없습니다. 구글은 해마다 8월 말에 새 앱의 targetSdk
# 하한을 올리고, 2026년 8월 31일부터는 36 입니다. compileSdk 는 targetSdk
# 보다 낮을 수 없으니 둘 다 36 이어야 합니다.
#
# AGP 를 올리는 방법도 있지만 그러면 안드로이드 스튜디오도 그만큼 새것이어야
# 합니다. **여기서는 자바를 한 줄도 컴파일해 본 적이 없어서** 안 되는 쪽으로
# 바꿔 놓는 위험을 피하고, 경고만 눌러 둡니다.
android.suppressUnsupportedCompileSdk=36
