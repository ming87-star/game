<!-- 공격 속도 36×36 · 깃털 하나 (ART.md 7.5)
     끝이 흩날려야 "가볍고 빠른 것"이 됩니다. 깃가지를 몇 가닥 떼어
     날려 보내면, 정지한 그림 한 장에 바람이 생깁니다.
     ×2(item-double)와는 오직 **개수**로 갈립니다 — 이쪽은 반드시 하나. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <g stroke="#01313f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 깃대 -->
    <path d="M28 4 L11 31" fill="none" stroke-width="2.2"/>
    <!-- 깃면 왼쪽 (넓은 쪽) -->
    <path d="M27 5.6 q-13 1 -18 12 q-3 6.4 -0.6 12.4 q4 -6 9.6 -9.4 z" fill="#4fc3f7"/>
    <!-- 깃면 오른쪽 (좁은 쪽) — 좌우 폭이 달라야 깃털로 읽힙니다 -->
    <path d="M28.6 5.6 q5 6 3 13 q-1.6 5.6 -8 8.4 q1.4 -8 -2.4 -14.6 z" fill="#29b6f6"/>
    <path d="M26.2 8 q-9.6 2.4 -13.6 11.4 q6 -6.4 11.4 -8.4 z" fill="#b3e5fc" stroke="none"/>
    <!-- 깃가지 -->
    <g stroke="#0277bd" stroke-width=".9" fill="none">
      <path d="M23 10.6 L13.6 15"/>
      <path d="M20 15.4 L11.6 20.6"/>
      <path d="M17 20.4 L10.4 26"/>
      <path d="M25.4 11 L28.6 15.6"/>
      <path d="M22.4 16.4 L26.6 20.6"/>
    </g>
    <path d="M27.4 6.6 q-8 1.6 -12.6 7.4" fill="none"
          stroke="#e1f5fe" stroke-opacity=".75" stroke-width="1.2"/>
  </g>
  <!-- 떨어져 날아가는 깃가지 — 여기가 "빠르다"를 말합니다 -->
  <g fill="#81d4fa" stroke="#01313f" stroke-width="1">
    <path d="M8 8.6 q4 -1.4 5.6 1 q-3.4 1.4 -5.6 -1 z"/>
    <path d="M3.6 15 q3.4 -1.2 4.8 0.8 q-3 1.2 -4.8 -0.8 z"/>
    <path d="M6 24.6 q3 -1 4.2 0.8 q-2.6 1 -4.2 -0.8 z"/>
  </g>
</svg>
