<!-- 회복 36×36 · 붉은 약병, 빛무리는 초록 (ART.md 7.5)
     병 안은 붉게, 둘레의 빛은 초록(#66BB6A)입니다. 색이 엇갈리는 것이
     일부러입니다 — 붉은 것은 "약", 초록 빛무리는 "낫는다"를 말합니다.
     체력이 급할 때 0.2초 안에 고르는 것이라, 병 모양이 단순해야 합니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <radialGradient id="heal" cx="50%" cy="55%" r="50%">
      <stop offset="0%"   stop-color="#a5d6a7" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#66bb6a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="18" cy="21" r="17" fill="url(#heal)"/>
  <g stroke="#3d0a0a" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- 병 — 목이 좁고 배가 둥근 플라스크 -->
    <path d="M14.6 8 L21.4 8 L21.4 14 q7.4 3.6 7.4 11.4 q0 8.6 -10.8 8.6
             q-10.8 0 -10.8 -8.6 q0 -7.8 7.4 -11.4 z" fill="#ef5350"/>
    <!-- 약이 찬 높이 — 위쪽은 비어 있어야 유리로 보입니다 -->
    <path d="M8.4 21.6 q9.6 4 19.2 0 q0.4 12.4 -9.6 12.4 q-10 0 -9.6 -12.4 z" fill="#c62828"/>
    <path d="M11.6 12.6 q-3.6 3.6 -3.8 8.4 q2.4 -5.6 5.4 -7.4 z" fill="#ff8a80" stroke="none"/>
    <!-- 유리 반사 -->
    <path d="M12.4 24 q-1 4.4 1.4 7.6" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.6"/>
    <!-- 마개 -->
    <path d="M13.4 4.6 L22.6 4.6 L22.6 8.6 L13.4 8.6 z" fill="#8d6e63"/>
    <path d="M14.2 5.4 L21.8 5.4 L21.8 7 L14.2 7 z" fill="#a1887f" stroke="none"/>
  </g>
  <!-- 낫는다는 표 — 초록 십자를 병 위에 얹지 않고 옆에 띄웁니다 -->
  <g fill="#a5d6a7" stroke="#1b5e20" stroke-width="1.2" stroke-linejoin="round">
    <path d="M27.4 9 L30.6 9 L30.6 12.2 L33.8 12.2 L33.8 15.4 L30.6 15.4
             L30.6 18.6 L27.4 18.6 L27.4 15.4 L24.2 15.4 L24.2 12.2 L27.4 12.2 z"/>
  </g>
</svg>
