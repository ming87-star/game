<!-- 손에 드는 단검 44×48 · 손잡이(22,38)를 축으로. 날은 위를 봅니다.
     검보다 짧고 폭이 좁습니다. 짧은 것이 단검의 성격이라 날을 길게 그리면
     그냥 작은 검이 됩니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="44" height="48" viewBox="0 0 44 48">
  <g stroke="#1e0f36" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <!-- 날 — 한쪽으로 살짝 휜 도(刀) -->
    <path d="M22 13 L25.4 19 L25 31 L19 31 L18.8 19 z" fill="#cfd8dc"/>
    <path d="M22 14.6 L24.6 19.4 L24.4 30 L22 30 z" fill="#90a4ae" stroke="none"/>
    <path d="M22 14.6 L19.4 19.4 L19.6 30 L22 30 z" fill="#f2f6f8" stroke="none"/>
    <path d="M21.4 15.4 L20 19.6 L20.2 29" fill="none"
          stroke="#ffffff" stroke-opacity=".6" stroke-width="0.9"/>
    <!-- 코등이 — 작게. 단검은 손을 크게 감싸지 않습니다 -->
    <path d="M16 32.6 q1.6 -1.6 3.4 -1.6 h5.2 q1.8 0 3.4 1.6 q-1.6 1.6 -3.4 1.6 h-5.2 q-1.8 0 -3.4 -1.6 z"
          fill="#ffd54f"/>
    <path d="M17.4 32.2 q1.2 -0.8 2.6 -0.8 h4 q1.4 0 2.6 0.8" fill="none"
          stroke="#ffeeb0" stroke-width="0.9"/>
    <!-- 자루 -->
    <path d="M19.8 34.4 h4.4 v6 h-4.4 z" fill="#4527a0"/>
    <path d="M19.8 36 h4.4 M19.8 38 h4.4" fill="none" stroke="#2a1560" stroke-width="0.8"/>
    <circle cx="22" cy="42.2" r="2.3" fill="#ffd54f"/>
    <circle cx="21.3" cy="41.5" r="0.8" fill="#ffeeb0" stroke="none"/>
  </g>
</svg>
