<!-- 전사 · 다리 조각 38×48 · 골반(19,33)을 축으로 돕니다
     원본에서 다리와 부츠만 떼어 왔습니다.

     다리를 따로 두는 것이 이 모션에서 가장 크게 달라지는 부분입니다.
     예전에는 그림 한 장을 통째로 앞으로 밀었더니 **발까지 같이 미끄러졌습니다.**
     사람은 발을 딛고 그 위에서 몸을 던집니다 — 발이 제자리에 남아야
     "밀었다"가 아니라 "실었다"가 됩니다. -->
