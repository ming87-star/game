<!-- 탑 안쪽 벽 500×960 · 세로로 이어 붙입니다
     화면의 대부분을 덮는 자리입니다. 그래서 지켜야 할 것이 둘입니다.

     1. 이음매가 없어야 합니다. 위로 계속 오르기 때문에, 위아래가 안 맞으면
        매 층마다 같은 자리에 선이 그어집니다. 그래서 무늬는 전부 패턴으로
        깔되 주기가 960 을 나누어떨어지게 잡았습니다 — 돌 두 켜가 96,
        960 / 96 = 10. 벽감은 480 마다, 960 / 480 = 2.
     2. 앞의 것을 잡아먹지 않아야 합니다. 값의 폭을 #182040 ~ #26315a 안에
        가둬서, 주인공과 적이 언제나 배경보다 밝게 남도록 했습니다.
        여기서 대비를 올리면 그림이 예뻐지고 게임은 안 보이게 됩니다.

     배경은 늘려서 깔리므로 4배까지 구울 것 없이 2배면 충분합니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="960" viewBox="0 0 500 960"
     data-bake-scale="2">
  <defs>
    <!-- 돌 두 켜가 한 주기. 둘째 켜를 반 칸 밀어 벽돌처럼 어긋물립니다 -->
    <pattern id="stone" width="125" height="96" patternUnits="userSpaceOnUse">
      <rect width="125" height="96" fill="#1d2542"/>
      <!-- 첫째 켜 -->
      <rect x="1"    y="1"  width="123" height="46" fill="#1f2848"/>
      <rect x="1"    y="1"  width="123" height="2"  fill="#26315a" opacity=".55"/>
      <!-- 둘째 켜 — 반 칸 밀어 이음매를 어긋냅니다 -->
      <rect x="-61.5" y="49" width="123" height="46" fill="#1c2340"/>
      <rect x="63.5"  y="49" width="123" height="46" fill="#1c2340"/>
      <rect x="-61.5" y="49" width="123" height="2"  fill="#26315a" opacity=".45"/>
      <rect x="63.5"  y="49" width="123" height="2"  fill="#26315a" opacity=".45"/>
    </pattern>

    <!-- 벽감(불빛)의 빛무리 -->
    <radialGradient id="sconce" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffb74d" stop-opacity=".30"/>
      <stop offset="55%"  stop-color="#ff9800" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0"/>
    </radialGradient>

    <!-- 좌우 끝으로 갈수록 어둡게 — 통이 둥글게 말려 들어가는 느낌.
         세로로는 변하지 않으므로 이어 붙여도 이음매가 생기지 않습니다 -->
    <linearGradient id="round" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0d1220" stop-opacity=".55"/>
      <stop offset="18%"  stop-color="#0d1220" stop-opacity=".10"/>
      <stop offset="50%"  stop-color="#0d1220" stop-opacity="0"/>
      <stop offset="82%"  stop-color="#0d1220" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#0d1220" stop-opacity=".55"/>
    </linearGradient>

    <!-- 기둥에 새긴 가로 띠. 96 주기라 돌 켜와 함께 맞아떨어집니다 -->
    <pattern id="ribs" width="26" height="96" patternUnits="userSpaceOnUse">
      <rect width="26" height="96" fill="#212c50"/>
      <rect y="44" width="26" height="8" fill="#1a2340"/>
      <rect y="44" width="26" height="2" fill="#2a3660" opacity=".7"/>
      <rect x="0" width="2" height="96" fill="#2a3660" opacity=".5"/>
    </pattern>
  </defs>

  <!-- 바탕 돌벽 -->
  <rect width="500" height="960" fill="url(#stone)"/>

  <!-- 벽감 둘 — 480 간격. 먼 데서 타는 등불 하나가 탑을 사람 사는 곳으로 만듭니다 -->
  <g>
    <rect x="222" y="150" width="56" height="76" rx="28" fill="#161d36"/>
    <rect x="228" y="156" width="44" height="64" rx="22" fill="#131a30"/>
    <circle cx="250" cy="196" r="62" fill="url(#sconce)"/>
    <ellipse cx="250" cy="196" rx="5" ry="8" fill="#ffb74d" opacity=".5"/>
    <ellipse cx="250" cy="194" rx="2.4" ry="4.4" fill="#fff3c4" opacity=".62"/>
    <rect x="243" y="204" width="14" height="10" rx="2" fill="#2a3660" opacity=".8"/>
  </g>
  <g>
    <rect x="222" y="630" width="56" height="76" rx="28" fill="#161d36"/>
    <rect x="228" y="636" width="44" height="64" rx="22" fill="#131a30"/>
    <circle cx="250" cy="676" r="62" fill="url(#sconce)"/>
    <ellipse cx="250" cy="676" rx="5" ry="8" fill="#ffb74d" opacity=".5"/>
    <ellipse cx="250" cy="674" rx="2.4" ry="4.4" fill="#fff3c4" opacity=".62"/>
    <rect x="243" y="684" width="14" height="10" rx="2" fill="#2a3660" opacity=".8"/>
  </g>

  <!-- 좌우 기둥 — 탑의 갈비뼈. 세로로 끝없이 이어집니다 -->
  <rect x="0"   y="0" width="26" height="960" fill="url(#ribs)"/>
  <rect x="474" y="0" width="26" height="960" fill="url(#ribs)"/>
  <rect x="26"  y="0" width="2"  height="960" fill="#141b33" opacity=".8"/>
  <rect x="472" y="0" width="2"  height="960" fill="#141b33" opacity=".8"/>

  <!-- 둥글게 말리는 느낌 -->
  <rect width="500" height="960" fill="url(#round)"/>
</svg>
