<!-- 기는 것 32×32 · 오른쪽을 봅니다
     껍질과 머리를 두 덩어리로 나눕니다. 하나짜리 타원은 32px에서 그냥 알로 보입니다.
     다리가 얇으면 줄였을 때 사라져 굴러가는 알이 됩니다.

     칠하는 법은 서른 장이 같습니다 — 덩어리마다 값을 세 단으로 끊고,
     왼쪽 위 모서리에만 흰 림라이트를 얇게 얹고, 눈에는 빛무리를 답니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="eyeglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="#4a1010" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">

    <!-- 다리 — 굵게. 관절을 꺾어야 막대가 아니라 다리입니다 -->
    <path d="M7 21 q-2 3 -3 7" fill="none" stroke-width="2"/>
    <path d="M12 23 q-1 3 -2 6" fill="none" stroke-width="2"/>
    <path d="M17 23 q1 3 1 6" fill="none" stroke-width="2"/>
    <path d="M23 22 q1.6 3 2 6" fill="none" stroke-width="2"/>
    <!-- 발끝 -->
    <path d="M4 28 l-1.6 1.4 M10 29 l-1.4 1.4 M18 29 l1.4 1.4 M25 28 l1.6 1.4"
          fill="none" stroke-width="1.4"/>

    <!-- 등껍질 -->
    <ellipse cx="12" cy="16" rx="10.5" ry="8" fill="#d63a3a"/>
    <!-- 어두운 면 — 오른쪽 아래 -->
    <path d="M14 8.4 q8.4 1.6 8.4 7.6 q0 6.6 -9 8 q6 -7.4 0.6 -15.6 z" fill="#9c2020" stroke="none"/>
    <!-- 밝은 면 — 왼쪽 위 -->
    <path d="M4 13 q8 -5 16 -1 q-8 -2 -16 1 z" fill="#ff8a80" stroke="none"/>
    <!-- 껍질 마디 -->
    <path d="M10 8.5 L9 24" fill="none" stroke-width="1.2"/>
    <path d="M16 10 L15 23" fill="none" stroke-width="1.2"/>
    <!-- 등에 돋은 가시 — 위험한 놈이라는 신호 -->
    <path d="M8 8.6 q0.4 -2.6 2.4 -3.4 q-0.6 2 -0.6 3.6 z" fill="#9c2020" stroke-width="1.2"/>
    <path d="M14.6 8.8 q0.8 -2.6 3 -3 q-1.2 1.8 -1.4 3.4 z" fill="#9c2020" stroke-width="1.2"/>
    <!-- 림라이트 -->
    <path d="M3.6 15.6 q1.4 -6.4 8.4 -7.4" fill="none" stroke="#ffffff" stroke-opacity=".32" stroke-width="1"/>

    <!-- 머리 — 껍질 앞에 따로. 여기에 눈이 붙어야 "앞"이 생깁니다 -->
    <circle cx="24" cy="17" r="6.5" fill="#ef5350"/>
    <path d="M25.6 11.4 q5 1.6 4.6 6 q-0.4 4.4 -5.6 5.4 q3.6 -5.6 1 -11.4 z"
          fill="#c62828" stroke="none"/>
    <path d="M19 14 q5 -3 9 0 q-5 -1 -9 0 z" fill="#ff8a80" stroke="none"/>

    <!-- 눈 — 크고 흽니다. 줄이면 이것만 남습니다 -->
    <circle cx="22.5" cy="15.5" r="3.6" fill="url(#eyeglow)" stroke="none"/>
    <circle cx="28" cy="17" r="3.2" fill="url(#eyeglow)" stroke="none"/>
    <circle cx="22.5" cy="15.5" r="3" fill="#ffffff"/>
    <circle cx="28" cy="17" r="2.6" fill="#ffffff"/>
    <circle cx="23.5" cy="15.8" r="1.4" fill="#3b0d0d" stroke="none"/>
    <circle cx="28.8" cy="17.2" r="1.2" fill="#3b0d0d" stroke="none"/>
    <circle cx="21.8" cy="14.6" r="0.6" fill="#ffffff" stroke="none"/>
    <circle cx="27.2" cy="16.1" r="0.5" fill="#ffffff" stroke="none"/>

    <!-- 집게턱 — 앞으로 벌어집니다. 위험한 쪽이 어느 쪽인지 -->
    <path d="M27 21 q4 0 5 -2" fill="none" stroke-width="1.8"/>
    <path d="M26 23 q4 1 6 -1" fill="none" stroke-width="1.8"/>
  </g>
</svg>
