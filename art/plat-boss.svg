<!-- 보스 투기장 발판 460×20 · 여기서 끝을 봅니다
     상점이 "들를 곳"이면 여기는 "도망칠 데가 없는 곳"입니다. 그 무게를 색과
     결로 말합니다 — 자주 몸통(#6a1b9a)에 밝은 테(#ce93d8), 그리고 갈라진 금.
     금은 왼쪽에서 오른쪽으로 갈수록 굵어집니다. 무너지기 직전으로 보이게. -->
<svg xmlns="http://www.w3.org/2000/svg" width="460" height="20" viewBox="0 0 460 20">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6a1b9a"/>
      <stop offset="55%"  stop-color="#5a1585"/>
      <stop offset="100%" stop-color="#3f0d61"/>
    </linearGradient>
    <linearGradient id="rune" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ce93d8" stop-opacity=".15"/>
      <stop offset="50%"  stop-color="#e1bee7" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ce93d8" stop-opacity=".15"/>
    </linearGradient>
  </defs>

  <rect x="0" y="4" width="460" height="16" rx="3" fill="url(#body)"/>
  <rect x="0" y="2" width="460" height="6" rx="3" fill="#ce93d8"/>
  <rect x="0" y="2" width="460" height="2" rx="1" fill="#e1bee7"/>
  <rect x="0" y="8" width="460" height="1.6" fill="#43106a" opacity=".8"/>

  <!-- 새겨진 띠 — 가운데가 밝게 타오릅니다 -->
  <rect x="30" y="12.4" width="400" height="2" rx="1" fill="url(#rune)"/>

  <!-- 갈라진 금 — 바닥에서 위로 찢고 올라옵니다. 오른쪽으로 갈수록 굵어집니다.
       좌우 대칭으로 꺾으면 금이 아니라 오른쪽을 가리키는 화살표(›)로 읽힙니다.
       꺾이는 폭을 매번 다르게, 기울기를 한쪽으로 몰아야 갈라진 것으로 보입니다 -->
  <g stroke="#3a0b59" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 20 l1.6 -4 l-2.4 -2.4 l1 -2"      stroke-width="1.1"/>
    <path d="M168 20 l-2 -3.4 l1.4 -3 l-2.6 -2.6"  stroke-width="1.4"/>
    <path d="M262 20 l2.4 -4.6 l-3 -2.6 l1.4 -3"   stroke-width="1.7"/>
    <path d="M344 20 l-2.6 -4 l2 -3.4 l-1.6 -3.2"  stroke-width="2"/>
    <path d="M408 20 l3 -5 l-3.4 -3 l1.6 -2.6"     stroke-width="2.3"/>
    <!-- 잔가지 -->
    <path d="M264.4 15.4 l3.6 -1.6" stroke-width=".9"/>
    <path d="M341.4 16 l-3.4 -1.4"  stroke-width="1"/>
    <path d="M411 15 l4 -1.4"       stroke-width="1.1"/>
  </g>
  <!-- 금 사이로 새는 빛 -->
  <g stroke="#ba68c8" fill="none" stroke-linecap="round" opacity=".45">
    <path d="M262.6 19.4 l2 -3.8"  stroke-width=".8"/>
    <path d="M343.6 19.4 l-2.2 -3.4" stroke-width=".8"/>
    <path d="M408.6 19.4 l2.6 -4.2" stroke-width=".9"/>
  </g>

  <rect x="0" y="17" width="460" height="3" rx="1.5" fill="#33094f"/>
  <!-- 양 끝 마감 -->
  <path d="M0 5 q0 -3 4 -3 l6 0 l-4 18 l-6 0 z" fill="#7e2bb0"/>
  <path d="M460 5 q0 -3 -4 -3 l-6 0 l4 18 l6 0 z" fill="#43106a"/>
  <rect x="2" y="2" width="200" height="1" fill="#ffffff" opacity=".3"/>
</svg>
