<!-- 유물 36×36
     ART.md 7.5 의 목록에는 없지만, tower.js:298 이 아직 SLOT.RELIC 을 놓습니다.
     나머지가 전부 그림으로 바뀌는데 이것만 글자 배지로 남으면 그 층만
     이질적으로 보이므로 함께 그렸습니다.

     한 판에 하나뿐인 것이라 가장 귀해 보여야 합니다. 메달(리본 달린 원반)과
     실루엣이 겹치지 않게, 발톱에 물린 보석으로 세웠습니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <radialGradient id="core" cx="40%" cy="32%" r="70%">
      <stop offset="0%"   stop-color="#fff8e1"/>
      <stop offset="40%"  stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#e08b00"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffe082" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffd54f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="18" cy="19" r="17.6" fill="url(#aura)"/>
  <g stroke="#4a3204" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- 받침 -->
    <path d="M11 27.6 L25 27.6 q1.6 0 1.6 2 L26.6 33 q0 1.4 -1.6 1.4 L11 34.4
             q-1.6 0 -1.6 -1.4 L9.4 29.6 q0 -2 1.6 -2 z" fill="#8d6208"/>
    <path d="M11.6 28.6 L24.4 28.6 L24.4 30.6 L11.6 30.6 z" fill="#c98a06" stroke="none"/>
    <!-- 발톱 -->
    <path d="M11.6 27.6 q-2.6 -5 0.4 -8" fill="none" stroke-width="2.4"/>
    <path d="M24.4 27.6 q2.6 -5 -0.4 -8" fill="none" stroke-width="2.4"/>
    <!-- 보석 -->
    <path d="M18 3 L27 12.4 L18 26 L9 12.4 z" fill="url(#core)"/>
    <path d="M18 3 L27 12.4 L18 26 z" fill="#e8a100" stroke="none" opacity=".55"/>
    <path d="M9 12.4 L27 12.4" fill="none" stroke="#4a3204" stroke-width="1.3"/>
    <path d="M12.4 9 L18 3 L23.6 9 z" fill="#fff8e1" stroke="none" opacity=".85"/>
  </g>
  <g fill="#fff8e1" stroke="#4a3204" stroke-width=".9">
    <path d="M31 6 l1.1 2.2 l2.2 1.1 l-2.2 1.1 l-1.1 2.2 l-1.1 -2.2 l-2.2 -1.1 l2.2 -1.1 z"/>
    <path d="M4.4 17 l.9 1.8 l1.8 .9 l-1.8 .9 l-.9 1.8 l-.9 -1.8 l-1.8 -.9 l1.8 -.9 z"/>
  </g>
</svg>
