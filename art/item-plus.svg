<!-- 공격력 36×36 · 빛나는 모루와 강화망치 (ART.md 7.5)
     동그라미 배지가 없어졌으므로 **그림 자체가 실루엣**입니다. 어두운 벽
     (#1D2542) 위에 바로 놓이니 밝고 또렷해야 합니다.

     망치는 모루 위에 떠 있고, 닿는 자리에서 불티가 튑니다. 그 불티가
     금빛(#FFD54F)이라 두 층 밖에서도 "공격력"으로 읽힙니다 — 가짜(item-fake-plus)
     와 갈리는 곳도 정확히 여기입니다. 저쪽은 불티 대신 검은 연기입니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff59d" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffd54f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g stroke="#1b2a33" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- 모루 -->
    <path d="M2 20 L10 16.4 L28 16.4 q3.6 0 3.6 3 L31.6 22.4 L21.4 22.4 L20.6 27.4
             L26 29.6 q2.6 1 2.6 3.8 L28.6 35 L5 35 L5 33.4 q0 -2.8 2.6 -3.8
             L13 27.4 L12.2 22.4 L2 22.4 z" fill="#90a4ae"/>
    <path d="M10 16.4 L28 16.4 q3.6 0 3.6 3 L31.6 20.4 L10 20.4 z" fill="#cfd8dc" stroke="none"/>
    <path d="M2 20 L12.2 20.4 L12.2 22.4 L2 22.4 z" fill="#78909c" stroke="none"/>
    <path d="M20.6 27.4 L26 29.6 q2.6 1 2.6 3.8 L28.6 35 L20.6 35 z" fill="#607d8b" stroke="none"/>
    <!-- 금테 — 보통 모루가 아니라 강화용이라는 표 -->
    <path d="M10.6 17.6 L27.6 17.6" fill="none" stroke="#ffd54f" stroke-width="1.4"/>
  </g>
  <!-- 불티 — 망치와 모루가 닿는 자리 -->
  <circle cx="18" cy="16" r="11" fill="url(#spark)"/>
  <g stroke="#1b2a33" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 떠 있는 망치 -->
    <path d="M20.4 8.6 L27.6 16.4 q1.2 1.4 0 2.6 q-1.4 1.2 -2.6 0 L17.8 11.2 z" fill="#8d6e63"/>
    <path d="M19.8 9.2 L26.4 16.4" fill="none" stroke="#a1887f" stroke-width="1.2"/>
    <path d="M6.6 2.6 L16.6 0.8 q1.8 -0.4 2.4 1.2 L21.2 8.6 q0.6 1.8 -1.2 2.4
             L10 12.8 q-1.8 0.4 -2.4 -1.4 L5.4 5 q-0.6 -1.8 1.2 -2.4 z" fill="#90a4ae"/>
    <path d="M7.4 3.2 L16.4 1.6 L18.2 7.8 L9.2 9.4 z" fill="#cfd8dc" stroke="none"/>
    <path d="M16.6 0.8 q1.8 -0.4 2.4 1.2 L21.2 8.6 q0.6 1.8 -1.2 2.4 L18 12 L14.8 1.6 z"
          fill="#607d8b" stroke="none"/>
    <path d="M7.6 4 L15.6 2.6" fill="none" stroke="#eceff1" stroke-opacity=".85" stroke-width="1.2"/>
  </g>
  <!-- 튀는 불티 조각 -->
  <g fill="#fff59d" stroke="#7a5a00" stroke-width=".8">
    <path d="M9 15 l1.4 2.6 l2.6 1.4 l-2.6 1.4 l-1.4 2.6 l-1.4 -2.6 l-2.6 -1.4 l2.6 -1.4 z"/>
    <path d="M28.6 12.4 l1 1.8 l1.8 1 l-1.8 1 l-1 1.8 l-1 -1.8 l-1.8 -1 l1.8 -1 z"/>
  </g>
</svg>
