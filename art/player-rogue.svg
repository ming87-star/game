<!-- 도적 40×48 · 오른쪽을 봅니다
     전사는 서 있고 궁수는 길쭉하니, 도적은 낮게 웅크려야 셋이 갈립니다.
     머리를 앞으로 내리고 무게를 아래에 두면 같은 48px 안에서도 "웅크림"이 읽힙니다.

     망토는 왼쪽 위로 찢어지듯 날립니다 — 정지한 그림 한 장에 속도를 넣는 것은
     이 대각선 하나뿐입니다. 끝을 뾰족하게 두 갈래로 갈라야 천처럼 보입니다.
     얼굴은 가리개로 덮고 눈만 남기되, 빛무리를 달아 어둠 속에서 켜진 것처럼. -->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="48" viewBox="0 0 40 48">
  <defs>
    <radialGradient id="eyeglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff59d" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#fff59d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="#1e0f36" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">

    <!-- ── 뒤로 찢어지듯 날리는 망토 ── -->
    <path d="M23 18 q-14 -4 -20 6 q7 -2 10 1 q-9 3 -11 12 q7 -2 11 -6 q-2 5 -1 8
             q6 -5 9 -12 z" fill="#5e35b1"/>
    <path d="M21 21 q-10 -1 -15 6 q8 -3 13 -1 z" fill="#7e57c2" stroke="none"/>
    <path d="M20 27 q-6 3 -9 9 q6 -4 10 -5 z" fill="#7e57c2" stroke="none"/>
    <!-- 망토 접힌 자국 -->
    <path d="M17 24 q-6 2 -9 6 M18 31 q-4 3 -6 7" fill="none" stroke-width="0.9" stroke-opacity=".55"/>
    <!-- 림라이트 — 바람 맞는 위쪽 모서리에만 -->
    <path d="M22 18.6 q-11 -3 -17 5" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="1"/>

    <!-- ── 웅크린 다리 — 무릎을 접어 앞으로. 발은 벌려 딛습니다 ── -->
    <path d="M15 32 q-5 4 -4 10 h5.4 q0 -5.4 3.6 -8.4 z" fill="#4527a0"/>
    <path d="M25 32 q5 4 4 10 h-5.4 q0 -5.4 -3.6 -8.4 z" fill="#5e35b1"/>
    <path d="M26 34 q2.6 2.6 3 6.4 l-2.4 0 q-0.6 -3.4 -2.6 -5.4 z" fill="#7e57c2" stroke="none"/>
    <!-- 무릎 감개 -->
    <path d="M12.6 38 q3.4 1 5.6 -0.6 M23 37.4 q3 1.6 5.6 0.6" fill="none" stroke-width="1"/>
    <!-- 발 -->
    <path d="M9 41.6 h8 q1.2 0 1.2 1.6 v3 q0 1.2 -1.2 1.2 h-8 q-1.2 0 -1.2 -1.2 v-3 q0 -1.6 1.2 -1.6 z"
          fill="#241645"/>
    <path d="M23 41.6 h8 q1.2 0 1.2 1.6 v3 q0 1.2 -1.2 1.2 h-8 q-1.2 0 -1.2 -1.2 v-3 q0 -1.6 1.2 -1.6 z"
          fill="#3a2653"/>
    <path d="M24 42.4 q3.4 -0.6 6.4 0" fill="none" stroke="#9575cd" stroke-width="0.9"/>

    <!-- ── 몸통 — 앞으로 기울인 사다리꼴 ── -->
    <path d="M17 20 q8.5 -4.5 15 2 q1.4 7 -1.6 12 q-6.4 2.4 -12 -0.6 q-2.4 -7 -1.4 -13.4 z"
          fill="#9575cd"/>
    <!-- 어두운 면 -->
    <path d="M28 22 q4 2 4 5.4 q0 3.6 -1.6 6.6 q-2 1 -4 1 q2.6 -6.4 1.6 -13 z"
          fill="#5e35b1" stroke="none"/>
    <!-- 밝은 면 -->
    <path d="M19 22.4 q5 -2 8.4 1 q0 6 -1 9.4 q-3 1 -5.4 0 q-2.2 -5 -2 -10.4 z"
          fill="#d1c4e9" stroke="none"/>
    <!-- 가슴을 가로지르는 띠와 버클 -->
    <path d="M18 24 q7.4 -1 12.4 4.4 l-1.6 2.8 q-4.4 -4.6 -11 -4 z" fill="#311b92"/>
    <circle cx="24.6" cy="27.6" r="1.3" fill="#ffd54f"/>
    <!-- 허리에 찬 던질 칼 두 자루 -->
    <path d="M16.6 30.6 l3.4 -1.4 l0.8 1.6 l-3.4 1.4 z" fill="#cfd8dc" stroke-width="1.1"/>
    <path d="M16.2 33.4 l3.4 -1.4 l0.8 1.6 l-3.4 1.4 z" fill="#b0bec5" stroke-width="1.1"/>

    <!-- ── 단검을 쥔 앞팔 — 뒤로 당겼다 찌르기 직전 ── -->
    <path d="M29.6 25.6 q4 1.2 5.4 4.4" fill="none" stroke-width="3.6"/>
    <path d="M29.6 25.6 q4 1.2 5.4 4.4" fill="none" stroke="#9575cd" stroke-width="2"/>
    <circle cx="35.2" cy="30.4" r="2" fill="#4527a0"/>
    <!-- 날 — 끝이 뾰족해야 막대가 아닙니다. 무기는 따로 갈아 끼우므로 짧게 -->
    <path d="M34 28.4 L39.4 22.6 L40 24 L35.6 30 z" fill="#eceff1"/>
    <path d="M34.6 28.8 L39.4 22.6 L39.7 23.4 L35 29.4 z" fill="#ffffff" stroke="none"/>
    <path d="M33 27.6 L36.4 30 l-1 1.6 l-3.4 -2.4 z" fill="#ffd54f" stroke-width="1.1"/>

    <!-- ── 두건 — 낮게 앞으로 숙인 머리 ── -->
    <path d="M18 20 q-2 -13.5 8 -14.5 q10.5 1 9.5 11.5 q-8.5 5 -17.5 3 z" fill="#5e35b1"/>
    <!-- 뒤로 흐르는 두건 꼬리 -->
    <path d="M20 7.6 q-9 -0.4 -12 6.4 q6.4 -3.4 11 -2.4 z" fill="#4527a0"/>
    <path d="M19.4 9 q-5.6 0.6 -8.4 4.4 q4.6 -2.4 8 -1.6 z" fill="#5e35b1" stroke="none"/>
    <!-- 밝은 면 -->
    <path d="M21 9 q2.4 -4.4 7.4 -4.4 q-5.4 1.4 -7.4 4.4 z" fill="#9575cd" stroke="none"/>
    <path d="M19 17 q-1 -11 8.6 -11.4" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="1"/>

    <!-- ── 얼굴 가리개 — 눈만 남깁니다. 이 띠 하나가 도적으로 읽히게 합니다 ── -->
    <path d="M20 12 q8.4 -2 15.4 2 q0 4.2 -1 5.2 q-8.4 2 -14.4 -1 z" fill="#241645"/>
    <path d="M20.6 12.6 q8 -1.6 14 1.8" fill="none" stroke="#4527a0" stroke-width="0.9"/>
    <ellipse cx="26" cy="15" rx="3.4" ry="3" fill="url(#eyeglow)" stroke="none"/>
    <ellipse cx="31.8" cy="15.8" rx="3.2" ry="2.8" fill="url(#eyeglow)" stroke="none"/>
    <ellipse cx="26" cy="15" rx="2" ry="1.5" fill="#ffee58" stroke="none"/>
    <ellipse cx="31.6" cy="15.7" rx="1.8" ry="1.4" fill="#ffee58" stroke="none"/>
  </g>
</svg>
