<!-- 전사 · 망토 조각 38×48 · 어깨(14,18)를 축으로 돕니다
     원본 player-warrior.svg 에서 망토 부분만 그대로 떼어 왔습니다. 칠도 좌표도
     한 글자 안 바꿨습니다 — 조각으로 나눈 것이지 다시 그린 것이 아닙니다.

     망토는 몸보다 **늦게** 따라옵니다. 몸이 앞으로 나간 뒤에 뒤로 밀리고,
     몸이 멈춘 뒤에도 한 번 더 흔들립니다. 이 늦음이 없으면 몸과 천이
     한 덩어리로 붙어 움직여서 종이 인형처럼 보입니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="38" height="48" viewBox="0 0 38 48">
  <g stroke="#131826" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
