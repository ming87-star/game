    <path d="M13 20 q-6 4 -7 12 q3 -6 8 -9 z" fill="#c94141" stroke="none"/>
    <path d="M11 24 q-4 5 -5 11 M14 27 q-3 5 -3 10" fill="none" stroke-width="0.9" stroke-opacity=".5"/>
    <path d="M13.6 17.6 q-8 3.4 -10 12" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="1"/>
  </g>
</svg>
