<!-- 궁수 42×48 · 오른쪽을 봅니다
     전사가 넓고 각지면 궁수는 좁고 길어야 합니다. 색만 다르면 32px에서 같은 놈입니다.
     실루엣을 가르는 것 셋 — 등 뒤로 크게 휘는 활, 뒤로 젖혀진 뾰족한 두건,
     그리고 얼굴이 보인다는 것(전사는 투구로 가렸습니다).

     칠하는 법은 서른 장이 같습니다. 한 덩어리마다 값을 세 단으로 끊고
     (어두운 면 · 바탕 · 밝은 면), 왼쪽 위 모서리에만 흰 림라이트를 얇게 얹고,
     눈에는 빛무리를 답니다. 평평한 셀 셰이딩을 지키되 납작하지는 않게. -->
<svg xmlns="http://www.w3.org/2000/svg" width="42" height="48" viewBox="0 0 42 48">
  <defs>
    <radialGradient id="eyeglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c4" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="#123018" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">

    <!-- ── 등에 멘 활 — 리커브. 끝이 반대로 꺾여야 막대가 아니라 활입니다 ── -->
    <path d="M20 4 q-6 4 -7 10 q-1 6 -1 12 q0 7 4 13 q-3 -1 -5 2"
          fill="none" stroke="#a9713d" stroke-width="2.8"/>
    <path d="M20 4 q-6 4 -7 10 q-1 6 -1 12 q0 7 4 13"
          fill="none" stroke="#d2955a" stroke-width="1.1"/>
    <path d="M20 4 L15 41" fill="none" stroke="#f5efe0" stroke-width="0.8" stroke-opacity=".85"/>
    <!-- 손잡이 감개 -->
    <path d="M11.6 21 q1.6 -0.6 2.4 0.4 l0 5 q-1.4 1 -2.6 0 z" fill="#4e342e" stroke-width="1.2"/>

    <!-- ── 화살통 — 어깨 너머로 깃이 솟습니다 ── -->
    <path d="M14 34 L19 21 L24 23 L20 36 q-3 2 -6 -2 z" fill="#5d4037"/>
    <path d="M15.6 32 L19.6 22 L21.6 22.8 L17.6 33 z" fill="#8d6e63" stroke="none"/>
    <path d="M16 25 q4 2 7 0" fill="none" stroke="#3e2723" stroke-width="1.1"/>

    <!-- ── 다리 — 가늘게 둘로. 뒤쪽을 어둡게 해 앞뒤를 만듭니다 ── -->
    <path d="M19 31 q-1.5 6 -0.5 11 h4.5 q1 -5 0.5 -11 z" fill="#1f5b2a"/>
    <path d="M25 31 q-1.5 6 -0.5 11 h4.5 q1 -5 0.5 -11 z" fill="#43a047"/>
    <path d="M26 32.5 q1.5 -0.5 2.5 0 q0 4 -0.5 8 q-1.5 0.5 -2.5 0 z" fill="#81c784" stroke="none"/>
    <!-- 정강이 감개 -->
    <path d="M18.6 36 q3 1.4 5.4 0 M24.6 36 q3 1.4 5.4 0" fill="none" stroke-width="1"/>
    <!-- 부츠 -->
    <path d="M16 41.6 h7 q1.2 0 1.2 1.6 v3 q0 1.2 -1.2 1.2 h-7 q-1.2 0 -1.2 -1.2 v-3 q0 -1.6 1.2 -1.6 z"
          fill="#2b1f14"/>
    <path d="M24 41.6 h7 q1.2 0 1.2 1.6 v3 q0 1.2 -1.2 1.2 h-7 q-1.2 0 -1.2 -1.2 v-3 q0 -1.6 1.2 -1.6 z"
          fill="#4a3524"/>
    <path d="M25 42.4 q3 -0.6 5.6 0" fill="none" stroke="#8d6e63" stroke-width="0.9"/>

    <!-- ── 겉옷 — 허리에서 갈라져 날립니다. 이 조각이 정지 그림에 바람을 넣습니다 ── -->
    <path d="M17 28 q-5 5 -7 13 q5 -3 8 -8 z" fill="#1f5b2a"/>
    <path d="M29 28 q4 4 5 10 q-4 -2 -6 -6 z" fill="#2e7d32"/>

    <!-- ── 몸통 — 어깨에서 허리까지 좁게 흐릅니다 ── -->
    <path d="M17 18 q7 -3.5 13 0 q1.4 8 -0.8 14 q-6 2.4 -11.4 0 q-2.2 -6 -0.8 -14 z" fill="#43a047"/>
    <!-- 어두운 면 — 오른쪽 아래 -->
    <path d="M27 19 q3 1 3 5 q0 5 -1 8 q-2 1 -4 1.2 q2 -7 2 -14.2 z" fill="#1f5b2a" stroke="none"/>
    <!-- 밝은 면 — 왼쪽 위 -->
    <path d="M18.6 19.6 q4 -1.6 7 -0.8 q0 6 -1 10.6 q-3 1 -4.6 0 q-1.6 -5 -1.4 -9.8 z"
          fill="#81c784" stroke="none"/>
    <!-- 가슴을 가로지르는 가죽끈 -->
    <path d="M18 21 q6.5 -1 11 4 l-1.6 2.8 q-4 -4.4 -10 -3.6 z" fill="#6d4c41"/>
    <circle cx="24" cy="24.6" r="1.2" fill="#ffc94d"/>
    <!-- 허리띠와 주머니 -->
    <path d="M17.4 28.6 q6 3 11.8 0 l-0.8 3.4 q-5.4 2 -10.2 0 z" fill="#5d4037"/>
    <path d="M19 31.4 q2.6 1 4.6 0 l-0.4 3 q-2 0.8 -3.8 0 z" fill="#8d6e63"/>

    <!-- ── 활을 잡은 앞팔 — 팔뚝 보호대에 금테 ── -->
    <path d="M29.4 21 q4.4 1.4 6 5.4" fill="none" stroke-width="3.6"/>
    <path d="M29.4 21 q4.4 1.4 6 5.4" fill="none" stroke="#43a047" stroke-width="2"/>
    <path d="M31.6 22.6 q2.6 1.4 3.4 3.6 l-2 1 q-0.8 -2.2 -3 -3.4 z" fill="#6d4c41"/>
    <path d="M32 22.4 q2.6 1.4 3.6 3.8" fill="none" stroke="#ffc94d" stroke-width="0.9"/>
    <circle cx="36" cy="27.4" r="2" fill="#f4c08a"/>

    <!-- ── 두건 — 뒤로 젖혀진 뾰족한 끝이 뒷머리를 만듭니다 ── -->
    <path d="M13 18 q-1 -16 11 -16 q11 0 10 13 q-10 5 -21 3 z" fill="#2e7d32"/>
    <!-- 뒤로 흐르는 뿔 -->
    <path d="M16 5 q-10 -1 -13 7 q8 -4 12 -2 z" fill="#1f5b2a"/>
    <path d="M15.4 6.6 q-6 0.6 -9 4.6 q5 -2.4 8.6 -1.6 z" fill="#2e7d32" stroke="none"/>
    <!-- 밝은 면 -->
    <path d="M16.4 9 q2.4 -5.4 8.4 -5.4 q-5.4 1.4 -8.4 5.4 z" fill="#66bb6a" stroke="none"/>
    <!-- 림라이트 — 왼쪽 위 모서리에만 -->
    <path d="M14 15 q-0.6 -12 9.6 -12.6" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="1"/>

    <!-- ── 얼굴 — 두건 앞으로 내밉니다. 셋 중 유일하게 얼굴이 보입니다 ── -->
    <ellipse cx="27" cy="14.4" rx="5.2" ry="4.8" fill="#f4c08a"/>
    <path d="M31.4 13.6 q2 0.8 1.4 2.4 q-1 0.6 -1.8 0.2 z" fill="#f4c08a"/>
    <!-- 두건 그늘이 눈 위로 떨어집니다 -->
    <path d="M22 11 q5.4 -2.6 10.4 1.4 q-0.6 1.6 -1.6 2 q-4.4 -2.6 -8.8 -1 z"
          fill="#c98f5e" stroke="none"/>
    <path d="M21 9 q6 -2 10.6 3.4" fill="none" stroke="#1f5b2a" stroke-width="2.4"/>
    <circle cx="28.6" cy="14.2" r="3.2" fill="url(#eyeglow)" stroke="none"/>
    <circle cx="28.6" cy="14.2" r="1.5" fill="#123018" stroke="none"/>
    <circle cx="29.1" cy="13.7" r="0.5" fill="#ffffff" stroke="none"/>
    <path d="M26.4 18 q2 1 3.4 0" fill="none" stroke-width="0.9"/>

    <!-- ── 어깨 너머 화살 깃 — 두건 위로 올려야 보입니다 ── -->
    <path d="M18.6 22 L10 9 M21 21 L13.6 7" fill="none" stroke="#8d6e63" stroke-width="1.2"/>
    <path d="M10 9 q-3.4 -3 -1.6 -5.4 q3.4 1.4 3.4 4.4 z" fill="#f5efe0" stroke-width="1.1"/>
    <path d="M13.6 7 q-2.4 -4 -0.4 -5.6 q3 2.2 2.2 5.2 z" fill="#a5d6a7" stroke-width="1.1"/>
  </g>
</svg>
