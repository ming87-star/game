<!-- 가짜 방어구 36×36 · 방패에 구멍이 뚫려 있습니다 (ART.md 7.5)
     방패의 바깥 윤곽과 가운데 돌기 자리는 진짜 그대로입니다. 다른 것은
     **관통한 구멍**과 거기서 뻗은 금, 그리고 빛을 잃은 테두리뿐입니다.

     구멍은 안을 검게 칠하지 않고 **비웁니다** (mask). 칠하면 무늬로 보이고,
     뚫어야 뒤의 벽이 비쳐 뚫린 것으로 보입니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <mask id="hole">
      <rect width="36" height="36" fill="#fff"/>
      <path d="M17.6 11 q6.4 0.6 6.8 5.6 q0.4 5.4 -5.4 6.6 q-6.4 -0.4 -7.2 -5.6
               q-0.6 -5.4 5.8 -6.6 z" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#hole)" stroke="#161d22" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M18 2 q9 3.4 15 3.4 q1 16 -5 24 q-4.4 5.6 -10 6.4 q-5.6 -0.8 -10 -6.4
             q-6 -8 -5 -24 q6 0 15 -3.4 z" fill="#5f6d7a"/>
    <path d="M18 4.6 q7.4 2.8 12.4 3 q0.8 14 -4.2 21 q-3.4 4.6 -8.2 5.4 z"
          fill="#6b7a86" stroke="none"/>
    <path d="M18 4.6 q-7.4 2.8 -12.4 3 q-0.8 14 4.2 21 q3.4 4.6 8.2 5.4 z"
          fill="#7e8d9b" stroke="none"/>
    <!-- 빛을 잃은 테두리 — 금색이 아니라 녹슨 놋빛 -->
    <path d="M18 2 q9 3.4 15 3.4 q1 16 -5 24 q-4.4 5.6 -10 6.4 q-5.6 -0.8 -10 -6.4
             q-6 -8 -5 -24 q6 0 15 -3.4 z" fill="none" stroke="#8d7734" stroke-width="1.5"/>
    <!-- 구멍에서 뻗은 금 -->
    <path d="M11.4 15.6 L6.6 13.4 M24.4 13.6 L29.6 10.6 M19.4 23.4 L21 30"
          fill="none" stroke="#161d22" stroke-width="1.5"/>
  </g>
  <!-- 뚫린 자리 — 찢겨 말린 쇠 -->
  <path d="M17.6 11 q6.4 0.6 6.8 5.6 q0.4 5.4 -5.4 6.6 q-6.4 -0.4 -7.2 -5.6
           q-0.6 -5.4 5.8 -6.6 z"
        fill="none" stroke="#161d22" stroke-width="1.9" stroke-linejoin="round"/>
  <g stroke="#4d5960" stroke-width="1.1" fill="none" stroke-linecap="round">
    <path d="M13.6 12.6 L11.6 10.4"/><path d="M23 12.4 L25 10.4"/>
    <path d="M13.2 21.4 L11.4 23.6"/>
  </g>
</svg>
