<!-- 메달 36×36 · 훈장, 금빛에 리본 (ART.md 7.5)
     판을 넘어 남는 화폐입니다. 다른 아이템은 이번 판에서만 쓰이는데
     이것만 밖으로 나가므로, 하나만 격이 달라 보여야 합니다 —
     그래서 리본을 달았습니다. 위가 갈라지고 아래가 둥근 실루엣은 이것뿐입니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <radialGradient id="shine" cx="38%" cy="32%" r="70%">
      <stop offset="0%"   stop-color="#fff3c4"/>
      <stop offset="45%"  stop-color="#ffca28"/>
      <stop offset="100%" stop-color="#c98a06"/>
    </radialGradient>
  </defs>
  <g stroke="#4a3204" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- 리본 두 갈래 -->
    <path d="M9 2 L15.6 2 L19.6 13 L12.4 14.4 z" fill="#c62828"/>
    <path d="M27 2 L20.4 2 L16.4 13 L23.6 14.4 z" fill="#8e1f1f"/>
    <path d="M10 3 L14.8 3 L17.6 11 L13 12 z" fill="#ef5350" stroke="none"/>
    <!-- 훈장 -->
    <circle cx="18" cy="23.6" r="11" fill="url(#shine)"/>
    <circle cx="18" cy="23.6" r="7.6" fill="none" stroke="#4a3204" stroke-width="1.3"/>
    <!-- 안의 별 -->
    <path d="M18 17.6 L19.9 21.4 L24.1 22 L21.1 24.9 L21.8 29 L18 27.1
             L14.2 29 L14.9 24.9 L11.9 22 L16.1 21.4 z" fill="#8d6208" stroke="none"/>
    <!-- 빛 -->
    <path d="M11.4 17.6 q2.6 -2.6 6 -3.4" fill="none"
          stroke="#fff8e1" stroke-opacity=".8" stroke-width="1.6"/>
  </g>
</svg>
