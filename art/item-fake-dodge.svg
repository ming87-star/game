<!-- 가짜 회피 36×36
     ART.md 7.5 의 가짜 목록에는 없지만, tower.js 의 MIMIC_DISGUISES 에는
     DODGE 가 들어 있습니다. 가짜가 회피로 둔갑할 수 있는데 그 그림만 없으면
     그 경우에만 정체가 그대로 드러나거나 표가 비어 버립니다. 그래서 그렸습니다.

     규칙은 같습니다 — 실루엣은 그대로, 안쪽만 망가뜨립니다.
     밑창이 뜯겨 벌어졌고, 끈이 끊겼고, 날개가 부러졌습니다.
     잔상은 남아 있되 재처럼 흐려집니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <g stroke="#1f1626" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M8 13.6 q4.6 -1.6 7 1.6 q1.6 2.6 5.2 3.6 q2.6 0.8 2.2 3.6 q-0.4 2.6 -3.6 2.6
             L9.2 25 q-2.2 0 -2 -2.6 z" fill="none" opacity=".45"/>
    <path d="M15 12.6 q5 -1.8 7.6 1.8 q1.8 2.8 5.6 3.8 q2.8 0.9 2.4 3.9 q-0.4 2.8 -3.9 2.8
             L16.4 24.4 q-2.4 0 -2.2 -2.8 z" fill="#6b5573"/>
    <path d="M16.4 14 q3.6 -1 5.4 1.6 q-3 -0.6 -5.2 0.6 z" fill="#8d7a93" stroke="none"/>
    <!-- 뜯겨 벌어진 밑창 -->
    <path d="M14.4 21 q4 1.4 8 1.4 L23 25.6 q-4.4 0.4 -7.2 -1 z" fill="#2b1f33"/>
    <path d="M23 22.4 q4 -0.2 7.6 -0.8" fill="none" stroke="#1f1626" stroke-width="1.4"/>
    <!-- 끊어진 끈 -->
    <g stroke="#3d2a49" stroke-width="1.2" fill="none">
      <path d="M18.6 13.4 L19.2 16"/>
      <path d="M19.8 18 L19.6 18.6"/>
      <path d="M22 14.6 L22.4 17"/>
    </g>
    <!-- 부러진 날개 -->
    <path d="M28 12 q2.4 0.4 3.6 1.8 q-2.4 0.6 -3.8 -0.2 z" fill="#6b5573"/>
    <path d="M32.6 15.6 L34.6 17.6" fill="none" stroke="#3d2a49" stroke-width="1.2"/>
  </g>
  <g stroke="#5b4a63" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".6">
    <path d="M5 29.6 L11 29.6"/>
    <path d="M10 32.6 L16 32.6"/>
  </g>
</svg>
