<!-- 가짜 방어구 (궁수) 36×36 · 가죽 방패에 구멍
     item-fake-armor 와 경로가 한 글자도 다르지 않습니다. 칠만 가죽으로 바뀝니다.

     왜 이것이 따로 있어야 하는가: 가짜는 **드러나기 전까지 진짜와 똑같아야**
     합니다. 강철 가짜 하나로 두 직업을 덮으면, 궁수가 초록 가죽 방패인 줄 알고
     다가섰을 때 드러나는 순간 색까지 강철로 바뀝니다. 그러면 "이건 망가진
     그것이었구나"가 아니라 "다른 물건으로 바뀌었네"가 됩니다.
     함정이 가르치는 것은 **같은 물건의 망가진 모습**을 알아보는 눈입니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <mask id="hole-archer">
      <rect width="36" height="36" fill="#fff"/>
      <path d="M17.6 11 q6.4 0.6 6.8 5.6 q0.4 5.4 -5.4 6.6 q-6.4 -0.4 -7.2 -5.6
               q-0.6 -5.4 5.8 -6.6 z" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#hole-archer)" stroke="#16221a" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M18 2 q9 3.4 15 3.4 q1 16 -5 24 q-4.4 5.6 -10 6.4 q-5.6 -0.8 -10 -6.4
             q-6 -8 -5 -24 q6 0 15 -3.4 z" fill="#3d5c33"/>
    <path d="M18 4.6 q7.4 2.8 12.4 3 q0.8 14 -4.2 21 q-3.4 4.6 -8.2 5.4 z"
          fill="#4e7245" stroke="none"/>
    <path d="M18 4.6 q-7.4 2.8 -12.4 3 q-0.8 14 4.2 21 q3.4 4.6 8.2 5.4 z"
          fill="#5e8455" stroke="none"/>
    <!-- 삭은 가죽 테두리 — 갈색이 바래 잿빛이 돕니다 -->
    <path d="M18 2 q9 3.4 15 3.4 q1 16 -5 24 q-4.4 5.6 -10 6.4 q-5.6 -0.8 -10 -6.4
             q-6 -8 -5 -24 q6 0 15 -3.4 z" fill="none" stroke="#5d4a3c" stroke-width="1.5"/>
    <!-- 끊어진 실밥 — 진짜의 꿰맨 자국이 풀린 자리 -->
    <g stroke="#6b5a4d" stroke-width="1" fill="none">
      <path d="M9 9.6 L10.4 11.4"/><path d="M8.6 18 L10.4 19"/>
      <path d="M23.4 27.4 L22 26"/>
    </g>
    <!-- 구멍에서 뻗은 찢김 -->
    <path d="M11.4 15.6 L6.6 13.4 M24.4 13.6 L29.6 10.6 M19.4 23.4 L21 30"
          fill="none" stroke="#16221a" stroke-width="1.5"/>
  </g>
  <!-- 뚫린 자리 — 찢겨 말린 가죽 -->
  <path d="M17.6 11 q6.4 0.6 6.8 5.6 q0.4 5.4 -5.4 6.6 q-6.4 -0.4 -7.2 -5.6
           q-0.6 -5.4 5.8 -6.6 z"
        fill="none" stroke="#16221a" stroke-width="1.9" stroke-linejoin="round"/>
  <g stroke="#43563c" stroke-width="1.1" fill="none" stroke-linecap="round">
    <path d="M13.6 12.6 L11.6 10.4"/><path d="M23 12.4 L25 10.4"/>
    <path d="M13.2 21.4 L11.4 23.6"/>
  </g>
</svg>
