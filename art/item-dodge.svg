<!-- 회피 36×36 · 가벼운 신 + 잔상 · 보라 #CE93D8 (ART.md 7.5)
     방어구(꽉 찬 견갑)와 달리 이쪽은 **빠져나간 자국**입니다. 신 하나를
     앞에 또렷하게 두고, 뒤로 잔상을 흘립니다. 잔상은 테두리만 남겨
     "이미 지나갔다"로 읽히게 합니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <g stroke="#3d1152" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 잔상 둘 — 뒤로 갈수록 옅게, 사이에 배경이 지나가게 -->
    <path d="M2 15 q4.4 -1.4 6.6 1.6 q1.6 2.4 5 3.4 q2.4 0.8 2 3.4 q-0.4 2.4 -3.4 2.4
             L3 25.8 q-2 0 -1.8 -2.4 z" fill="none" opacity=".4"/>
    <path d="M8 13.6 q4.6 -1.6 7 1.6 q1.6 2.6 5.2 3.6 q2.6 0.8 2.2 3.6 q-0.4 2.6 -3.6 2.6
             L9.2 25 q-2.2 0 -2 -2.6 z" fill="#9c5fb0" opacity=".55"/>
    <!-- 신 — 굽이 낮고 앞이 들린 가벼운 신 -->
    <path d="M15 12.6 q5 -1.8 7.6 1.8 q1.8 2.8 5.6 3.8 q2.8 0.9 2.4 3.9 q-0.4 2.8 -3.9 2.8
             L16.4 24.4 q-2.4 0 -2.2 -2.8 z" fill="#ce93d8"/>
    <path d="M16.4 14 q3.6 -1 5.4 1.6 q-3 -0.6 -5.2 0.6 z" fill="#f3e5f5" stroke="none"/>
    <!-- 밑창 — 한 줄로 갈라 두께를 만듭니다 -->
    <path d="M14.4 21 q7.6 2.4 16.2 0.6" fill="none" stroke="#7b3fa0" stroke-width="1.4"/>
    <!-- 끈 -->
    <g stroke="#4a148c" stroke-width="1.2" fill="none">
      <path d="M18.6 13.4 L19.6 18.6"/>
      <path d="M22 14.6 L22.6 19.4"/>
    </g>
    <!-- 날개 — 가볍다는 표 하나 -->
    <path d="M28 12 q4 0.6 5.4 3.6 q-3.6 0.4 -5.8 -1.6 z" fill="#e1bee7"/>
  </g>
  <g stroke="#ce93d8" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".75">
    <path d="M4 29.6 L13 29.6"/>
    <path d="M9 32.6 L19 32.6"/>
  </g>
</svg>
