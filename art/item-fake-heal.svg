<!-- 가짜 회복 36×36 · 병이 깨지고 내용물이 검습니다 (ART.md 7.5)
     병의 윤곽과 마개 자리는 진짜 그대로입니다. 달라진 것은 셋 —
     유리에 금이 갔고, 안이 검고, 초록 십자가 부러져 있습니다.
     빛무리도 초록에서 검은 김으로 바뀝니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <radialGradient id="rot" cx="50%" cy="55%" r="50%">
      <stop offset="0%"   stop-color="#1a1a1a" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="18" cy="21" r="17" fill="url(#rot)"/>
  <g stroke="#1c1414" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M14.6 8 L21.4 8 L21.4 14 q7.4 3.6 7.4 11.4 q0 8.6 -10.8 8.6
             q-10.8 0 -10.8 -8.6 q0 -7.8 7.4 -11.4 z" fill="#6d4c4c"/>
    <path d="M8.4 21.6 q9.6 4 19.2 0 q0.4 12.4 -9.6 12.4 q-10 0 -9.6 -12.4 z" fill="#1f1f1f"/>
    <!-- 깨진 금 -->
    <path d="M17 13.6 L14 19 L18.6 22 L15.4 27" fill="none" stroke="#1c1414" stroke-width="1.6"/>
    <path d="M14 19 L10 18.4 M18.6 22 L23 20.6" fill="none" stroke="#1c1414" stroke-width="1.2"/>
    <!-- 떨어져 나간 조각 -->
    <path d="M24.6 15.6 L28.2 17.6 L26.6 20.4 z" fill="#1c1414" stroke="none"/>
    <path d="M13.4 4.6 L22.6 4.6 L22.6 8.6 L13.4 8.6 z" fill="#5d4037"/>
  </g>
  <!-- 부러진 십자 — 진짜의 그 자리, 조각이 어긋나 있습니다 -->
  <g fill="#5b6b5c" stroke="#12200f" stroke-width="1.2" stroke-linejoin="round">
    <path d="M27.4 9 L30.6 9 L30.6 12.2 L33.8 12.2 L33.8 15.4 L30.6 15.4 L30.6 12.2 L27.4 12.2 z"/>
    <path d="M26.4 16 L29.6 16.6 L29 19.8 L25.8 19.2 z"/>
  </g>
</svg>
