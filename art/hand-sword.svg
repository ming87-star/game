<!-- 손에 드는 검 44×48 · 손잡이(22,40)를 축으로. 날은 **위**를 봅니다.
     기울여 쥐는 각도는 코드가 정합니다 (js/motion.js 의 HAND).

     아이콘처럼 선만 긋지 않고 **쇠붙이로 보이게** 칠합니다. 규칙은 이 게임의
     서른 장이 지키는 것과 같습니다 — 한 덩어리를 세 단으로 끊고(어두운 면 ·
     바탕 · 밝은 면), 왼쪽 위 모서리에만 흰 림라이트를 얇게 얹습니다.
     날에는 피홈을 한 줄 넣습니다. 그 한 줄이 판금과 칼날을 가릅니다.

     칠은 **밝은 강철**로 둡니다. 게임이 무기 색(단계마다 다릅니다)을 곱해서
     입히므로, 바탕이 어두우면 색이 안 올라옵니다. 나중에 희귀도가 붙으면
     그 색을 한 번 더 곱하면 됩니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="44" height="48" viewBox="0 0 44 48">
  <g stroke="#131826" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">

    <!-- 날 — 끝이 뾰족해야 막대가 아니라 칼입니다 -->
    <path d="M22 3 L26 11 L25.4 32 L18.6 32 L18 11 z" fill="#c3d4e4"/>
    <!-- 어두운 면 (오른쪽) -->
    <path d="M22 5 L25 11.4 L24.6 31 L22 31 z" fill="#8fa3b5" stroke="none"/>
    <!-- 밝은 면 (왼쪽) -->
    <path d="M22 5 L19 11.4 L19.4 31 L22 31 z" fill="#eef4fa" stroke="none"/>
    <!-- 피홈 -->
    <path d="M22 9 L22 30" fill="none" stroke="#7d93a8" stroke-width="0.9" stroke-opacity=".8"/>
    <!-- 림라이트 — 왼쪽 날등 -->
    <path d="M21.4 6 L19.6 11.6 L20 29" fill="none"
          stroke="#ffffff" stroke-opacity=".55" stroke-width="0.9"/>

    <!-- 코등이 — 양끝이 위로 살짝 젖혀져야 장식이 아니라 손을 지키는 것이 됩니다 -->
    <path d="M12 34.6 q2 -2.6 4.6 -2.6 h10.8 q2.6 0 4.6 2.6 q-2 2.4 -4.6 2.4 h-10.8 q-2.6 0 -4.6 -2.4 z"
          fill="#ffc94d"/>
    <path d="M13.6 34.2 q1.6 -1.4 3.4 -1.4 h10 q1.8 0 3.4 1.4" fill="none"
          stroke="#ffe9a8" stroke-width="1"/>

    <!-- 자루 — 감은 자국 셋 -->
    <path d="M19.4 37 h5.2 v6 h-5.2 z" fill="#5d4037"/>
    <path d="M19.4 38.4 h5.2 M19.4 40.2 h5.2 M19.4 42 h5.2" fill="none"
          stroke="#3e2723" stroke-width="0.8"/>

    <!-- 자루 끝 구슬 -->
    <circle cx="22" cy="44.6" r="2.6" fill="#ffc94d"/>
    <circle cx="21.2" cy="43.8" r="0.9" fill="#ffe9a8" stroke="none"/>
  </g>
</svg>
