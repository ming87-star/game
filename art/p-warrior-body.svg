<!-- 전사 · 몸통과 머리 조각 38×48 · 허리(19,32)를 축으로 돕니다
     원본에서 몸통 · 허리띠 · 앞어깨 · 투구 · 깃을 떼어 왔습니다.
     검과 그 검을 쥔 팔은 여기 없습니다 — p-warrior-arm 으로 갔습니다.

     허리를 축으로 두는 것은, 사람이 벨 때 **허리부터 돌기** 때문입니다.
     목이나 발을 축으로 돌리면 상체가 통째로 넘어가는 것처럼 보입니다.

     앞어깨(견갑)는 여기 남깁니다. 팔이 그 아래에서 도니까 어깨를 크게 돌려도
     이음매가 안 보입니다 — 갑옷이 관절을 덮는 것과 같은 이치입니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="38" height="48" viewBox="0 0 38 48">
  <defs>
    <radialGradient id="eyeglow-w" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe37a" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#ffe37a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g stroke="#131826" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">

    <!-- 몸통 -->
    <path d="M12 19 q7 -3 15 0 q1 8 -2 15 q-5 2 -11 0 q-3 -7 -2 -15 z" fill="#7d93a8"/>
    <path d="M23 19.6 q4 0.6 4 4 q0.4 6 -2 10.4 q-2.4 1 -4.4 1.2 q3.4 -8 2.4 -15.6 z"
          fill="#546a80" stroke="none"/>
    <path d="M13 20 q4 -2 8 -1 q0 6 -1 11 q-3 1 -5 0 q-2 -5 -2 -10 z" fill="#a8bccd" stroke="none"/>
    <path d="M12 30 q6 3 14 0 l-1 4 q-6 2 -12 0 z" fill="#ffc94d"/>
    <path d="M12.6 30.6 q6 2.6 12.8 0" fill="none" stroke="#ffe9a8" stroke-width="0.8"/>

    <!-- 앞쪽 어깨 -->
    <path d="M24 17 q8 0 8 6 q0 4 -4 4 q-4 0 -6 -3 z" fill="#b9c9d8"/>
    <path d="M25 21 q5 -1 6 3 q-4 1 -6 -1 z" fill="#7d93a8" stroke="none"/>
    <path d="M24.6 17.4 q7 0.4 7 5.4" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="1"/>

    <!-- 투구 -->
    <path d="M12 16 q-1 -13 8 -13 q9 0 8 13 q-8 3 -16 0 z" fill="#a8bccd"/>
    <path d="M13 9 q-1 -6 7 -6 q4 0 6 3 q-7 -1 -13 3 z" fill="#dbe6f0" stroke="none"/>
    <path d="M12.6 14 q-0.8 -10.4 7 -10.6" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="1"/>
    <path d="M14 9 q7 -3 13 0 q0 3 -1 4 q-6 2 -12 0 z" fill="#1a2130"/>
    <ellipse cx="23" cy="11" rx="3.4" ry="2.8" fill="url(#eyeglow-w)" stroke="none"/>
    <ellipse cx="23" cy="11" rx="2.1" ry="1.6" fill="#ffe37a" stroke="none"/>
    <path d="M25 8 q3 4 2 8 l-2 0 q1 -5 -1 -8 z" fill="#7d93a8"/>

    <!-- 투구 깃 -->
    <path d="M19 3 q1 -4 5 -3 q-1 3 -3 4 z" fill="#e04b4b"/>
    <path d="M19 3 q-5 -1 -8 5 q5 -2 8 -3 z" fill="#a52b2b"/>
    <path d="M18.6 3.6 q-4.4 -0.4 -6.6 3.6" fill="none" stroke="#e04b4b" stroke-opacity=".7" stroke-width="0.9"/>
  </g>
</svg>
