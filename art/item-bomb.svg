<!-- 함정 36×36 · 진짜 폭탄. 숨기지 않습니다 (ART.md 7.5)
     가짜 넷은 진짜를 흉내 내지만 이것만은 대놓고 폭탄입니다. 그래서
     혼자만 **검은 쇠공** — 다른 아홉이 밝은 물건인 사이에서 이 검정 하나가
     "결이 다른 것"으로 읽힙니다. 색을 못 외운 사람도 이건 압니다.

     타들어 가는 심지가 곧 시계입니다. 불티는 흰빛이라 어두운 몸 위에서
     유일하게 밝은 점이 됩니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <radialGradient id="fuse" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff3c4" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ff7043" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iron" cx="36%" cy="30%" r="72%">
      <stop offset="0%"   stop-color="#5a616b"/>
      <stop offset="55%"  stop-color="#2f343c"/>
      <stop offset="100%" stop-color="#15181d"/>
    </radialGradient>
  </defs>
  <g stroke="#0b0d10" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
    <!-- 쇠공 -->
    <circle cx="16.4" cy="23" r="12" fill="url(#iron)"/>
    <path d="M7.6 15.4 q3.4 -3.4 8 -4" fill="none"
          stroke="#8f98a6" stroke-opacity=".8" stroke-width="1.8"/>
    <!-- 주둥이 -->
    <path d="M13.4 11.6 L21.4 8.6 L23 12.6 L15.4 15.6 z" fill="#3c424b"/>
    <path d="M14.2 12 L20.8 9.6 L21.6 11.6 L15 14 z" fill="#5a616b" stroke="none"/>
    <!-- 심지 -->
    <path d="M21.6 10.4 q5.4 -3.4 7 -7.4" fill="none" stroke="#8d6e63" stroke-width="2.2"/>
    <path d="M22.4 10 q4.6 -3 6 -6.4" fill="none" stroke="#bcaaa4" stroke-width=".9"/>
  </g>
  <!-- 불티 -->
  <circle cx="29.4" cy="3.6" r="6.6" fill="url(#fuse)"/>
  <path d="M29.4 0.6 q3.4 2.6 2.2 5.4 q-1 2.2 -3.6 1.8 q-2.4 -0.4 -1.8 -3
           q0.6 -2.2 3.2 -4.2 z" fill="#ffca28" stroke="#7a3a00" stroke-width="1.1"/>
  <path d="M29.4 2.6 q1.8 1.8 1 3.4 q-1.2 1 -2 -0.2 q-0.6 -1.2 1 -3.2 z"
        fill="#ffffff" stroke="none"/>
</svg>
