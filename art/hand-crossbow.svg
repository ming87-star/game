<!-- 손에 드는 석궁 44×48 · 손잡이(17,30)를 축으로.
     활은 세로로 크고 석궁은 **가로로 짧습니다.** 그 차이가 실루엣에서 둘을
     가릅니다 — 개머리가 뒤로 뻗고 짧은 활이 앞에 가로로 걸립니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="44" height="48" viewBox="0 0 44 48">
  <g stroke="#123018" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- 개머리와 몸통 -->
    <path d="M6 32 q-1.4 -3.4 1.6 -4.4 L30 25.4 l0 4.6 L8.6 33.4 q-2 0.4 -2.6 -1.4 z" fill="#5d4037"/>
    <path d="M8 28.6 L29 26.2" fill="none" stroke="#a9713d" stroke-width="1.2"/>
    <!-- 짧은 활 — 세로로 걸립니다 -->
    <path d="M28 15.6 q5 5 5 11.4 q0 6.4 -5 11.4" fill="none" stroke="#5d4037" stroke-width="3.6"/>
    <path d="M28 15.6 q5 5 5 11.4 q0 6.4 -5 11.4" fill="none" stroke="#a9713d" stroke-width="1.8"/>
    <!-- 시위 -->
    <path d="M28.6 16.6 L28.6 37.4" fill="none" stroke="#f5efe0" stroke-width="1" stroke-opacity=".9"/>
    <!-- 걸린 화살 -->
    <path d="M12 27.4 L34 26" fill="none" stroke="#8d6e63" stroke-width="1.4"/>
    <path d="M34 26 L30.2 24.4 L30.4 27.8 z" fill="#eceff1"/>
    <!-- 방아쇠와 손잡이 -->
    <path d="M15.6 31.6 q2.6 -0.4 3.6 1.4 l-0.6 5.6 q-1.8 1 -3.6 0 z" fill="#4e342e"/>
    <path d="M17 33.6 q1.4 1 1 2.6" fill="none" stroke="#ffc94d" stroke-width="1.1"/>
    <!-- 쇠 장식 — 석궁은 나무보다 쇠가 많이 보여야 무겁게 읽힙니다 -->
    <path d="M22.6 25.8 l5.4 -0.6 l0 4.4 l-5.4 0.6 z" fill="#90a4ae"/>
    <path d="M23.2 26.6 l4 -0.4" fill="none" stroke="#eceff1" stroke-width="0.8"/>
  </g>
</svg>
