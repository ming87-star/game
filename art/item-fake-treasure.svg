<!-- 가짜 보물상자(미믹) 36×36 · 이빨과 눈이 드러난 궤 (ART.md 7.5)
     궤의 윤곽·판자·쇠테·자물쇠 자리는 진짜 그대로입니다. 다른 넷과 같은
     규칙입니다 — **같은 물건의 망가진 판**이라야 "속았다"가 됩니다.

     달라진 것은 셋. 나무가 삭아 잿빛이 되었고, 금테가 녹슬었고, 틈에서
     새어 나오던 금빛 자리에 이빨과 두 눈이 들어앉았습니다.
     빛무리도 금빛에서 검은 김으로 바뀝니다.

     이 그림은 **밟아서 드러난 뒤에만** 보입니다. 발판 위에 놓여 있는 동안은
     진짜 상자 그림을 그대로 답니다 (js/tower.js 의 slotArtKey) —
     겉으로 구분이 되면 함정이 아니라 그냥 표지판입니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <radialGradient id="mawDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a1a1a" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="18" cy="17.5" rx="16" ry="8" fill="url(#mawDark)"/>
  <g stroke="#161010" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- 궤의 몸 — 진짜와 같은 길, 색만 삭았습니다 -->
    <path d="M4 19 L32 19 L32 31 q0 2 -2 2 L6 33 q-2 0 -2 -2 z" fill="#5d5049"/>
    <path d="M13 19.6 L13 32.6 M23 19.6 L23 32.6" fill="none"
          stroke="#3a312c" stroke-width="1.2"/>
    <!-- 녹슨 쇠테 -->
    <path d="M4 22.4 L32 22.4" fill="none" stroke="#8d7a3a" stroke-width="2.4"/>
    <!-- 아가리 -->
    <path d="M5 18.6 L31 18.6 L31 15.4 L5 15.4 z" fill="#120c0c"/>
    <!-- 뚜껑 — 더 크게 젖혀져 있습니다 -->
    <path d="M4.4 15.6 q0 -8.4 13.6 -8.4 q13.6 0 13.6 8.4 z" fill="#6b5c54"/>
    <path d="M17.4 7.2 L17.4 15.4" fill="none" stroke="#3a312c" stroke-width="1.2"/>
    <path d="M4.4 12.6 q1.6 -5.4 13.6 -5.4 q12 0 13.6 5.4" fill="none"
          stroke="#8d7a3a" stroke-width="2.2"/>
  </g>
  <!-- 이빨 — 위아래로 맞물립니다 -->
  <g fill="#f5f5f5" stroke="#161010" stroke-width="1" stroke-linejoin="round">
    <path d="M7.4 15.4 L10.2 15.4 L8.8 19 z"/>
    <path d="M13.6 15.4 L16.4 15.4 L15 19 z"/>
    <path d="M19.6 15.4 L22.4 15.4 L21 19 z"/>
    <path d="M25.8 15.4 L28.6 15.4 L27.2 19 z"/>
    <path d="M10.8 18.6 L13.6 18.6 L12.2 15.4 z"/>
    <path d="M22.8 18.6 L25.6 18.6 L24.2 15.4 z"/>
  </g>
  <!-- 두 눈 — 아가리 안쪽 어둠에서 이쪽을 봅니다 -->
  <g stroke="#3d2f00" stroke-width="1">
    <ellipse cx="12.6" cy="12.4" rx="2.8" ry="2.2" fill="#ffd54f"/>
    <ellipse cx="23.4" cy="12.4" rx="2.8" ry="2.2" fill="#ffd54f"/>
    <ellipse cx="12.6" cy="12.4" rx="1" ry="1.9" fill="#1a1000" stroke="none"/>
    <ellipse cx="23.4" cy="12.4" rx="1" ry="1.9" fill="#1a1000" stroke="none"/>
  </g>
  <!-- 자물쇠 — 진짜의 그 자리, 고리가 뜯겨 나갔습니다 -->
  <g stroke="#2b2200" stroke-width="1.3" stroke-linejoin="round">
    <path d="M14.6 20.4 L21.4 20.4 L21.4 26.6 L14.6 26.6 z" fill="#8d7a3a"/>
    <path d="M17 22.6 L19.6 24.8 M19.6 22.6 L17 24.8" fill="none" stroke="#2b2200" stroke-width="1.2"/>
  </g>
</svg>
