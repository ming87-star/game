<!-- 보물상자 36×36 · 반쯤 열린 나무 궤 (ART.md 7.5)
     이것만은 "무엇이 들었는지 모르는 것"입니다. 다른 아홉은 모양이 곧
     내용이지만(약병=회복, 모루=공격력), 상자는 안이 안 보여야 합니다.
     그래서 뚜껑을 조금만 열고, 그 틈으로 금빛만 새어 나오게 했습니다 —
     "좋은 것이 들었다"까지만 말하고 무엇인지는 말하지 않습니다.

     구간마다 반드시 한 번씩 놓이는 것이라(js/tower.js 의 treasureFloorFor),
     멀리서도 단번에 알아봐야 합니다. 가로로 넓적한 실루엣은 이것뿐입니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <radialGradient id="chestGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff59d" stop-opacity=".95"/>
      <stop offset="60%"  stop-color="#ffca28" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#ffca28" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 틈으로 새어 나오는 빛. 몸보다 먼저 깔아야 뒤에서 비칩니다 -->
  <ellipse cx="18" cy="17.5" rx="16" ry="8" fill="url(#chestGlow)"/>
  <g stroke="#2e1a0c" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- 궤의 몸 -->
    <path d="M4 19 L32 19 L32 31 q0 2 -2 2 L6 33 q-2 0 -2 -2 z" fill="#8d6e63"/>
    <!-- 판자 이음매 -->
    <path d="M13 19.6 L13 32.6 M23 19.6 L23 32.6" fill="none"
          stroke="#5d4037" stroke-width="1.2"/>
    <!-- 쇠테 -->
    <path d="M4 22.4 L32 22.4" fill="none" stroke="#ffb300" stroke-width="2.4"/>
    <path d="M4 22.4 L32 22.4" fill="none" stroke="#fff59d" stroke-opacity=".5" stroke-width=".8"/>
    <!-- 열린 틈. 어둡게 두면 미믹의 아가리와 같은 그림이 됩니다 —
         여기서는 빛이 새어 나와야 합니다 -->
    <path d="M5 19 L31 19 L31 14.2 L5 14.2 z" fill="#ffca28"/>
    <path d="M6.6 18 L29.4 18 L29.4 15.4 L6.6 15.4 z" fill="#fff8e1" stroke="none"/>
    <!-- 뚜껑. 젖혀져 있어서 그 아래로 빛이 새어 나옵니다 -->
    <path d="M4.4 15.2 q0 -8.4 13.6 -8.4 q13.6 0 13.6 8.4 z" fill="#a1887f"/>
    <path d="M6.6 13.8 q1 -5.4 8.4 -6.2" fill="none"
          stroke="#d7ccc8" stroke-opacity=".7" stroke-width="1.6"/>
    <path d="M17.4 6.8 L17.4 15" fill="none" stroke="#6d4c4c" stroke-width="1.2"/>
    <!-- 뚜껑을 두른 금테 -->
    <path d="M4.4 12.2 q1.6 -5.4 13.6 -5.4 q12 0 13.6 5.4" fill="none"
          stroke="#ffb300" stroke-width="2.2"/>
  </g>
  <!-- 자물쇠 — 상자라는 것을 한 점으로 말해 주는 표 -->
  <g stroke="#5d3a00" stroke-width="1.3" stroke-linejoin="round">
    <path d="M14.6 18 L21.4 18 L21.4 25.4 L14.6 25.4 z" fill="#ffca28"/>
    <circle cx="18" cy="21.4" r="1.7" fill="#5d3a00" stroke="none"/>
    <path d="M18 21.8 L18 24" fill="none" stroke="#5d3a00" stroke-width="1.2"/>
  </g>
</svg>
