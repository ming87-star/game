<!-- 뛰는 것 34×32 · 오른쪽을 봅니다
     "뛴다"를 정지한 그림 한 장으로 말해야 합니다. 접힌 뒷다리를 크게 그려
     감긴 용수철처럼 보이게 하는 것이 전부입니다.

     한 번 실패하고 배운 것: 뒷다리를 덩어리로만 두면 몸에서 떨어진 다른 물체로
     보입니다. 허벅지 → 무릎 → 정강이 → 발로 이어지는 Z 를 그려야 붙습니다.
     입선도 실루엣 밖으로 나가면 혀처럼 달라붙으므로 안쪽에서 끝냅니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="34" height="32" viewBox="0 0 34 32">
  <defs>
    <radialGradient id="eyeglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f1f8e9" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#f1f8e9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="#14300a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">

    <!-- ── 접은 뒷다리 — 무릎이 등 위로 솟습니다. 실루엣 뒤쪽의 봉우리 ──
         한 덩어리로 끊어 두면 몸 옆에 놓인 다른 물체로 보입니다. 허벅지를
         몸 안쪽 깊숙이(x 18까지) 밀어 넣어 몸에서 자라 나오게 합니다. -->
    <path d="M18 21 q-9 1 -11.5 -5 q-1.5 -4.5 2.5 -5.5 q4.5 -1 4.5 4 q0 4 4.5 4.5 z" fill="#33691e"/>
    <path d="M12 11.6 q2 1.4 1.6 4.4 q-1.6 -0.8 -2.8 0.2 q1 -2.6 -0.4 -4.2 z"
          fill="#558b2f" stroke="none"/>
    <!-- 정강이: 무릎에서 아래로 접혀 발까지 이어집니다 -->
    <path d="M6.6 13.6 q-4.4 5.4 -2.6 11 q2 3.2 5.2 1.4 q-2.4 -5.4 1 -9.6 z" fill="#43781f"/>
    <path d="M7 15.6 q-2.6 4.4 -1.4 8.4 q-1.6 -4.4 0 -7.6 z" fill="#558b2f" stroke="none"/>
    <!-- 물갈퀴 뒷발 — 넓게 펴서 바닥을 짚습니다 -->
    <path d="M4 24 q-3.6 2.6 -2 5.4 q1.6 2 4.4 1 q3.4 -1.2 4 -3.6 q-4.4 -0.6 -6.4 -2.8 z" fill="#2b5a17"/>
    <path d="M4.6 28 q2.8 1.4 5.4 0.6 M6 26 q2.2 1.6 4.6 1.4" fill="none" stroke-width="0.9"/>

    <!-- ── 몸 — 앞으로 낮게 기운 덩어리 ── -->
    <path d="M9 19.5 q0.5 -9 11 -9.5 q11.5 -0.5 12.5 8 q0.5 6.5 -8 8 q-12.5 2 -15.5 -6.5 z"
          fill="#7cb342"/>
    <!-- 어두운 면 — 오른쪽 아래 -->
    <path d="M26 12.6 q6.4 2 6.4 7 q0.4 5.4 -6.6 7 q3.6 -6.6 0.2 -14 z" fill="#4e7d24" stroke="none"/>
    <!-- 등의 밝은 면 -->
    <path d="M12 15.6 q7 -4.6 15 -1.6 q-8 -1.4 -15 1.6 z" fill="#aed581" stroke="none"/>
    <!-- 배 — 밝게. 위아래가 갈려야 납작해 보이지 않습니다 -->
    <path d="M12.6 23.6 q8.4 3.4 16.4 -2 q-2 5.4 -9.4 5.6 q-6 0.2 -7 -3.6 z"
          fill="#ecf7d9" stroke="none"/>
    <!-- 등의 사마귀 — 개구리 살갗 -->
    <circle cx="16" cy="15.4" r="0.9" fill="#558b2f" stroke="none"/>
    <circle cx="20.6" cy="14.2" r="1.1" fill="#558b2f" stroke="none"/>
    <circle cx="25" cy="15" r="0.9" fill="#558b2f" stroke="none"/>
    <circle cx="18.4" cy="18.4" r="0.8" fill="#558b2f" stroke="none"/>
    <!-- 림라이트 — 등 왼쪽 위 -->
    <path d="M10.6 18.6 q1.4 -7.6 9.6 -8.4" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="1"/>

    <!-- ── 앞다리 — 짧고 통통하게. 뒷다리와 크기 차이가 커야 "뛰는 놈"입니다 ── -->
    <path d="M25.6 23.6 q3.4 2.6 3 6 q-0.6 2.4 -3 2 q-1.6 -0.6 -1.4 -2.4
             q0.4 -2.6 -1.4 -4.4 z" fill="#4e7d24"/>
    <path d="M22.6 29.6 q3.4 2 6.4 -0.4" fill="none" stroke-width="1.4"/>
    <path d="M23 30.2 q3 1.6 5.6 -0.2" fill="none" stroke="#8bc34a" stroke-width="0.8"/>

    <!-- ── 입 — 크게 째지되 실루엣 안에서 끝냅니다. 아래턱을 밝게 얹어 주둥이를 만듭니다 ── -->
    <path d="M23.6 20.4 q4.6 1.6 8.4 -2.4 q0.6 3 -2.4 4.6 q-4 1.6 -6 -2.2 z"
          fill="#ecf7d9" stroke="none"/>
    <path d="M23.6 19.6 q4.6 1.4 8.4 -2" fill="none" stroke-width="1.3"/>
    <path d="M29.4 18.6 q1.6 1 1.8 2.4" fill="none" stroke-width="1"/>

    <!-- ── 튀어나온 눈 — 머리 위에 얹습니다. 개구리는 여기서 판가름 납니다 ── -->
    <circle cx="20" cy="9" r="4.6" fill="#7cb342"/>
    <circle cx="27.2" cy="10" r="4.2" fill="#8bc34a"/>
    <path d="M17 7 q2.6 -3 6 -2.6 q-3.6 0.6 -5.4 3 z" fill="#aed581" stroke="none"/>
    <circle cx="20" cy="8.4" r="4.4" fill="url(#eyeglow)" stroke="none"/>
    <circle cx="27.2" cy="9.4" r="4" fill="url(#eyeglow)" stroke="none"/>
    <circle cx="20" cy="8.4" r="2.9" fill="#f1f8e9" stroke="none"/>
    <circle cx="27.2" cy="9.4" r="2.6" fill="#f1f8e9" stroke="none"/>
    <ellipse cx="21" cy="8.8" rx="1.3" ry="1.6" fill="#14300a" stroke="none"/>
    <ellipse cx="28.1" cy="9.8" rx="1.2" ry="1.5" fill="#14300a" stroke="none"/>
    <circle cx="19.4" cy="7.4" r="0.7" fill="#ffffff" stroke="none"/>
    <circle cx="26.5" cy="8.4" r="0.6" fill="#ffffff" stroke="none"/>
  </g>
</svg>
