<!-- 가짜 공격력 36×36 · 진짜(item-plus)와 실루엣이 같아야 합니다
     아주 다르게 그리면 멀리서 바로 들켜 함정이 뜻을 잃고, 똑같이 그리면
     알아볼 길이 없어 그냥 세금이 됩니다. 그래서 모루의 자리와 망치의 각도는
     그대로 두고 **안쪽만 망가뜨렸습니다** — 모루에 금, 망치 머리가 쪼개짐,
     그리고 불티 대신 검은 연기. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <radialGradient id="smoke" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a1a1a" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g stroke="#161d22" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M2 20 L10 16.4 L28 16.4 q3.6 0 3.6 3 L31.6 22.4 L21.4 22.4 L20.6 27.4
             L26 29.6 q2.6 1 2.6 3.8 L28.6 35 L5 35 L5 33.4 q0 -2.8 2.6 -3.8
             L13 27.4 L12.2 22.4 L2 22.4 z" fill="#6b7a82"/>
    <path d="M10 16.4 L28 16.4 q3.6 0 3.6 3 L31.6 20.4 L10 20.4 z" fill="#93a3ab" stroke="none"/>
    <path d="M20.6 27.4 L26 29.6 q2.6 1 2.6 3.8 L28.6 35 L20.6 35 z" fill="#4d5960" stroke="none"/>
    <!-- 갈라진 금 — 모루를 위아래로 관통합니다 -->
    <path d="M16 16.6 L14.4 22 L17.6 25.4 L15.4 30 L18 35" fill="none"
          stroke="#161d22" stroke-width="1.8"/>
    <path d="M14.4 22 L10.6 21" fill="none" stroke="#161d22" stroke-width="1.2"/>
    <!-- 금테가 벗겨져 끊겨 있습니다 -->
    <path d="M10.6 17.6 L15 17.6 M21 17.6 L27.6 17.6" fill="none"
          stroke="#8d7734" stroke-width="1.4"/>
  </g>
  <circle cx="17" cy="15" r="12" fill="url(#smoke)"/>
  <g stroke="#161d22" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 자루는 그대로, 머리가 부러져 나갔습니다 -->
    <path d="M20.4 8.6 L27.6 16.4 q1.2 1.4 0 2.6 q-1.4 1.2 -2.6 0 L17.8 11.2 z" fill="#6d5a52"/>
    <path d="M6.6 2.6 L16.6 0.8 q1.8 -0.4 2.4 1.2 L21.2 8.6 q0.6 1.8 -1.2 2.4
             L10 12.8 q-1.8 0.4 -2.4 -1.4 L5.4 5 q-0.6 -1.8 1.2 -2.4 z" fill="#6b7a82"/>
    <path d="M7.4 3.2 L16.4 1.6 L18.2 7.8 L9.2 9.4 z" fill="#93a3ab" stroke="none"/>
    <!-- 머리를 가르는 큰 균열 -->
    <path d="M11.4 1.6 L9.6 6.4 L13 8 L11 12.4" fill="none" stroke="#161d22" stroke-width="1.8"/>
    <path d="M18.4 4 L21.6 3.2 L20 6.6 z" fill="#161d22" stroke="none"/>
  </g>
  <!-- 검은 연기 -->
  <g fill="#26282b" stroke="#161d22" stroke-width=".9" opacity=".95">
    <circle cx="9" cy="16.6" r="3"/>
    <circle cx="5.6" cy="13" r="2.2"/>
    <circle cx="29" cy="12.6" r="2.4"/>
  </g>
</svg>
