<!-- 탑의 수문장 320×240 · 다섯 보스의 맏이 — 줄을 골라 내리꽂습니다
     위에 떠 있고 아래턱이 발판 가까이 내려옵니다. 근접이 닿는 자리가 거기라
     턱이 두툼해야 "여기를 때리는 것"으로 읽힙니다.

     다섯이 한 핏줄로 보이게 하는 것 셋 — 남보라 몸(#311b92/#4527a0),
     위로 벌어진 왕관 뿔, 그리고 아래로 내려온 턱. 갈리게 하는 것은 하나뿐,
     **무엇이 위험한가**입니다. 이놈은 두 눈입니다. 어느 줄을 보고 있는지가
     유일한 예고이므로, 눈이 크고 붉고 확실히 켜져 있어야 합니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240"
     data-bake-scale="2">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4b32ad"/>
      <stop offset="52%"  stop-color="#3a1f9c"/>
      <stop offset="100%" stop-color="#25136e"/>
    </linearGradient>
    <radialGradient id="eyeglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff5252" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#ff5252" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="#140a3d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">

    <!-- ── 뿔 — 위로 벌어져 왕관처럼. 몸보다 먼저 그려 뒤로 보냅니다 ── -->
    <path d="M56 66 L22 0 L96 44 z"   fill="#1a237e"/>
    <path d="M264 66 L298 0 L224 44 z" fill="#1a237e"/>
    <path d="M100 46 L84 2 L134 36 z"  fill="#151c66"/>
    <path d="M220 46 L236 2 L186 36 z" fill="#151c66"/>
    <path d="M160 32 L160 0 L182 26 z" fill="#151c66"/>
    <path d="M26 6 L56 56"  fill="none" stroke="#3949ab" stroke-width="3"/>
    <path d="M294 6 L264 56" fill="none" stroke="#3949ab" stroke-width="3"/>

    <!-- ── 몸 — 가로로 넓적하게. 세로로 길면 화면을 덮는 무게가 안 납니다 ── -->
    <path d="M14 118 q0 -74 76 -80 q70 -6 140 0 q76 6 76 80 q0 66 -70 76
             q-76 10 -152 0 q-70 -10 -70 -76 z" fill="url(#hull)"/>
    <!-- 이마 판 — 밝게. 여기가 가장 앞입니다 -->
    <path d="M44 92 q0 -46 60 -52 q56 -6 112 0 q60 6 60 52 q-58 -22 -116 -22
             q-58 0 -116 22 z" fill="#4527a0"/>
    <path d="M56 74 q30 -26 74 -28 q-46 12 -66 34 z" fill="#5e3fc4" stroke="none"/>
    <!-- 왼쪽 위 림라이트 -->
    <path d="M18 112 q2 -64 70 -72" fill="none" stroke="#8c7ae6" stroke-opacity=".5" stroke-width="3"/>

    <!-- 갑판 이음매 -->
    <path d="M22 138 q138 26 276 0" fill="none" stroke="#2a1580" stroke-width="3"/>
    <path d="M30 156 q130 22 260 0" fill="none" stroke="#2a1580" stroke-width="2.4"/>

    <!-- ── 눈 — 이놈의 전부. 어디를 보는지가 유일한 예고입니다 ── -->
    <circle cx="112" cy="112" r="46" fill="url(#eyeglow)" stroke="none"/>
    <circle cx="208" cy="112" r="46" fill="url(#eyeglow)" stroke="none"/>
    <circle cx="112" cy="112" r="30" fill="#ff5252"/>
    <circle cx="208" cy="112" r="30" fill="#ff5252"/>
    <circle cx="112" cy="112" r="13" fill="#fff59d" stroke="none"/>
    <circle cx="208" cy="112" r="13" fill="#fff59d" stroke="none"/>
    <circle cx="104" cy="103" r="5" fill="#ffffff" stroke="none" opacity=".8"/>
    <circle cx="200" cy="103" r="5" fill="#ffffff" stroke="none" opacity=".8"/>
    <!-- 눈두덩 — 위에서 덮어 눌러야 노려보는 것으로 읽힙니다 -->
    <path d="M74 92 q38 -20 76 -2 l-6 12 q-32 -14 -66 2 z" fill="#1a237e"/>
    <path d="M246 92 q-38 -20 -76 -2 l6 12 q32 -14 66 2 z" fill="#1a237e"/>

    <!-- ── 아래턱 — 발판 가까이 내려옵니다. 근접이 닿는 자리 ── -->
    <path d="M80 184 q80 -12 160 0 q6 34 -14 46 q-66 10 -132 0 q-20 -12 -14 -46 z"
          fill="#1a237e"/>
    <path d="M92 192 q68 -8 136 0 q-68 6 -136 0 z" fill="#3949ab" stroke="none"/>
    <g fill="#ffffff" stroke-width="3">
      <path d="M96 188 L120 188 L108 220 z"/>
      <path d="M128 190 L152 190 L140 224 z"/>
      <path d="M160 190 L184 190 L172 224 z"/>
      <path d="M192 190 L216 190 L204 220 z"/>
    </g>
  </g>
</svg>
