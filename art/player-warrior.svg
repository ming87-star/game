<!-- 전사 38×48 · 오른쪽을 봅니다
     실루엣이 네모나면 32px에서 로봇으로 읽힙니다. 어깨는 둥근 덩어리로,
     망토는 왼쪽 아래로 흐르게, 검은 오른쪽 위로 비스듬히 — 이 대각선이
     "칼 든 사람"으로 읽히게 하는 전부입니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="38" height="48" viewBox="0 0 38 48">
  <g stroke="#131826" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">

    <!-- 등 뒤로 흐르는 망토. 실루엣의 무게를 왼쪽 아래에 둡니다 -->
    <path d="M14 17 q-9 3 -11 14 q-1 6 2 11 q5 -3 7 -9 q2 -7 4 -10 z" fill="#a52b2b"/>
    <path d="M13 20 q-6 4 -7 12 q3 -6 8 -9 z" fill="#c94141" stroke="none"/>

    <!-- 검 — 어깨에 걸친 채 오른쪽 위로. 끝이 뾰족해야 막대가 아니라 칼입니다 -->
    <path d="M25.4 25.6 L31.2 6.6 L35 2 L34 8.4 L28.6 27 z" fill="#c3d4e4"/>
    <path d="M25.4 25.6 L31.2 6.6 L35 2 L32.8 6.4 L27.4 26.2 z" fill="#ffffff" stroke="none"/>
    <!-- 코등이와 자루 -->
    <path d="M22.4 23.6 L30.2 26.6 L29.2 29.4 L21.4 26.4 z" fill="#ffc94d"/>
    <path d="M24.4 28.6 L21.4 33.4" fill="none" stroke-width="2.6"/>

    <!-- 다리 · 부츠 — 둘을 벌려 놓습니다. 붙이면 아래가 회색 덩어리가 됩니다 -->
    <path d="M14 33 q-1 5 0 8 h4 q1 -4 0 -8 z" fill="#465a70"/>
    <path d="M21 33 q-1 5 0 8 h4 q1 -4 0 -8 z" fill="#5f778f"/>
    <path d="M11 41 h7 q1 0 1 2 v3 q0 1 -1 1 h-7 q-1 0 -1 -1 v-3 q0 -2 1 -2 z" fill="#2c3849"/>
    <path d="M20 41 h7 q1 0 1 2 v3 q0 1 -1 1 h-7 q-1 0 -1 -1 v-3 q0 -2 1 -2 z" fill="#3b4c61"/>

    <!-- 몸통 — 어깨는 넓고 허리는 좁게. 네모가 아니라 사다리꼴 -->
    <path d="M12 19 q7 -3 15 0 q1 8 -2 15 q-5 2 -11 0 q-3 -7 -2 -15 z" fill="#7d93a8"/>
    <path d="M13 20 q4 -2 8 -1 q0 6 -1 11 q-3 1 -5 0 q-2 -5 -2 -10 z" fill="#a8bccd" stroke="none"/>
    <path d="M12 30 q6 3 14 0 l-1 4 q-6 2 -12 0 z" fill="#ffc94d"/>

    <!-- 앞쪽 어깨 — 둥근 덩어리를 어깨 끝에. 가운데로 오면 방패처럼 떠 보입니다 -->
    <path d="M24 17 q8 0 8 6 q0 4 -4 4 q-4 0 -6 -3 z" fill="#b9c9d8"/>
    <path d="M25 21 q5 -1 6 3 q-4 1 -6 -1 z" fill="#7d93a8" stroke="none"/>
    <!-- 검을 쥔 팔 -->
    <path d="M22 27 q3 1 4 4" fill="none" stroke-width="3.4"/>
    <path d="M22 27 q3 1 4 4" fill="none" stroke="#8fa3b5" stroke-width="1.8"/>

    <!-- 투구 — 위는 둥글고 앞에는 코가리개. 눈은 크고 밝게 -->
    <path d="M12 16 q-1 -13 8 -13 q9 0 8 13 q-8 3 -16 0 z" fill="#a8bccd"/>
    <path d="M13 9 q-1 -6 7 -6 q4 0 6 3 q-7 -1 -13 3 z" fill="#dbe6f0" stroke="none"/>
    <path d="M14 9 q7 -3 13 0 q0 3 -1 4 q-6 2 -12 0 z" fill="#1a2130"/>
    <ellipse cx="23" cy="11" rx="2.1" ry="1.6" fill="#ffe37a" stroke="none"/>
    <!-- 코가리개 — 앞을 보고 있다는 것을 이 한 줄이 말해 줍니다 -->
    <path d="M25 8 q3 4 2 8 l-2 0 q1 -5 -1 -8 z" fill="#7d93a8"/>

    <!-- 투구 깃 -->
    <path d="M19 3 q1 -4 5 -3 q-1 3 -3 4 z" fill="#e04b4b"/>
    <path d="M19 3 q-5 -1 -8 5 q5 -2 8 -3 z" fill="#a52b2b"/>
  </g>
</svg>
