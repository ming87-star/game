<!-- 「내려온 것」 96×120 · 엔딩에만 나옵니다 (STORY.md 5절)

     ── 왜 새로 그리는가 ─────────────────────────────────
     엔딩에서 주인공을 죽이는 놈입니다. 게임 안의 어느 층에도 안 나옵니다 —
     도감에도 없습니다. 층이 올라서 만나는 놈이면 「더 오르면 이길 수 있다」가
     되고, 그러면 엔딩이 그냥 하나 남은 벽이 됩니다.

     ── 이름이 곧 모양입니다 ─────────────────────────────
     이 게임의 모든 것은 **오릅니다.** 주인공도, 기는 것도, 뛰는 것도.
     이것만 **내려옵니다.** 그래서 다리가 없습니다 — 아래가 너덜너덜 풀려
     있고, 팔이 몸보다 길게 늘어져 있습니다. 서 있는 것이 아니라 걸려 있는
     것으로 보여야 합니다.

     ── 값 ───────────────────────────────────────────────
     벽(#101731~#31407a)보다 어둡습니다. 적은 늘 배경보다 밝게 그렸는데
     이것만 반대로 갑니다 — 벽에서 도려낸 구멍처럼 보이는 것이 목적입니다.
     눈 하나만 밝습니다. 주인공과 적이 다 눈이 빛나므로, 그 규칙은 지킵니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="120" viewBox="0 0 96 120">
  <defs>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#dbe4ff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#8fa6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mantle" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%"   stop-color="#161d38"/>
      <stop offset="55%"  stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
  </defs>

  <!-- 늘어진 팔 둘. 몸보다 길어야 「걸려 있다」가 됩니다. 왼팔이 조금 더 깁니다 -->
  <g stroke="#070b16" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M22 44 q-8 22 -4 44"/>
    <path d="M74 44 q9 20 4 38"/>
  </g>
  <g stroke="#2a3560" stroke-width="1.4" stroke-linecap="round" fill="none" opacity=".55">
    <path d="M19.6 46 q-7 21 -3.6 40"/>
    <path d="M71.6 46 q8 19 3.6 34"/>
  </g>
  <!-- 손끝 — 손가락 셋. 다섯이면 사람 손이 되어 무섭지 않습니다 -->
  <g stroke="#070b16" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M18 88 l-4 11 M18 88 l1 12 M18 88 l6 10"/>
    <path d="M78 82 l-5 10 M78 82 l0 12 M78 82 l6 9"/>
  </g>

  <!-- 몸 — 어깨에서 아래로 넓어지다 풀립니다. 밑단이 너덜너덜해야 발이 없는
       것으로 읽힙니다. 반듯하게 자르면 그 순간 「서 있는 사람」이 됩니다 -->
  <path d="M48 12
           q-22 2 -25 26
           q-3 20 -1 40
           l3 18 l4 -13 l4 15 l4 -16 l5 17 l6 -19 l6 19 l5 -17 l4 16 l4 -15 l4 13 l3 -18
           q2 -20 -1 -40 q-3 -24 -25 -26 z"
        fill="url(#mantle)"/>
  <!-- 왼쪽 모서리 빛 한 줄. 이것 하나로 부피가 섭니다 -->
  <path d="M40 15 q-14 6 -16 26 q-2 18 -0.6 34"
        fill="none" stroke="#3a4a86" stroke-width="1.6" opacity=".5"/>

  <!-- 두건 — 머리를 덮고 앞이 뚫려 있습니다 -->
  <path d="M48 4 q-20 0 -22 22 q-1 10 2 16 q20 7 40 0 q3 -6 2 -16 q-2 -22 -22 -22 z"
        fill="#0d1428"/>
  <path d="M48 6 q-16 0 -18 19" fill="none" stroke="#46548d" stroke-width="1.5" opacity=".45"/>
  <!-- 두건 안쪽 — 아무것도 없습니다 -->
  <path d="M48 14 q-13 0 -14 15 q0 8 3 11 q11 4 22 0 q3 -3 3 -11 q-1 -15 -14 -15 z"
        fill="#04060d"/>

  <!-- 눈 하나. 주인공도 적도 다 눈이 빛납니다 — 그 규칙만은 지킵니다 -->
  <circle cx="48" cy="30" r="12" fill="url(#eye)"/>
  <ellipse cx="48" cy="30" rx="3.4" ry="2" fill="#eef2ff"/>
</svg>
