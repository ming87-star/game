<!-- 손에 드는 창 44×48 · 손잡이(22,40)를 축으로. 촉은 위를 봅니다.
     검과 갈리는 것은 **긴 대**입니다. 촉은 좁고 길어야 베는 것이 아니라
     찌르는 것으로 읽힙니다. 칠하는 법은 hand-sword 와 같습니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="44" height="48" viewBox="0 0 44 48">
  <g stroke="#131826" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- 대 -->
    <path d="M20 17 h4 v29 h-4 z" fill="#8d6e63"/>
    <path d="M20.6 18 v27" fill="none" stroke="#c39b86" stroke-width="1"/>
    <!-- 촉 아래 목 -->
    <path d="M19 15 h6 v3 h-6 z" fill="#ffc94d"/>
    <!-- 촉 — 좁고 긴 잎사귀 -->
    <path d="M22 2 L25.6 10 L24.6 16 L19.4 16 L18.4 10 z" fill="#c3d4e4"/>
    <path d="M22 4 L24.8 10.4 L24 15 L22 15 z" fill="#8fa3b5" stroke="none"/>
    <path d="M22 4 L19.2 10.4 L20 15 L22 15 z" fill="#eef4fa" stroke="none"/>
    <path d="M22 6 L22 14.4" fill="none" stroke="#7d93a8" stroke-width="0.8" stroke-opacity=".8"/>
    <path d="M21.4 4.6 L19.8 10.6" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="0.9"/>
    <!-- 가로대 — 찌른 것이 더 안 들어오게 막는 것 -->
    <path d="M13.6 18.6 h16.8 v2.8 h-16.8 z" fill="#ffc94d"/>
    <path d="M14.2 19.2 h15.6" fill="none" stroke="#ffe9a8" stroke-width="0.9"/>
    <!-- 손 자리 감개 -->
    <path d="M19.6 34 h4.8 v8 h-4.8 z" fill="#5d4037"/>
    <path d="M19.6 36 h4.8 M19.6 38 h4.8 M19.6 40 h4.8" fill="none" stroke="#3e2723" stroke-width="0.8"/>
    <circle cx="22" cy="45.4" r="2.2" fill="#ffc94d"/>
  </g>
</svg>
