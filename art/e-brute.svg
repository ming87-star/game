<!-- 단단한 놈 32×34 · 오른쪽을 봅니다
     "느리고 두껍다"가 곧 실루엣입니다.

     세 번 고쳐 얻은 규칙 넷:
     1. 좌우 대칭이면 아무리 두꺼워도 서 있는 상자입니다. 등을 왼쪽 위로 부풀리고
        머리를 오른쪽으로 내밀어 대각선을 만듭니다.
     2. 가슴에 가로 띠를 두르면 나무통 테가 됩니다. V 자 판으로 덮습니다.
     3. 팔·몸·어깨를 같은 갈색으로 칠하면 전부 한 덩어리로 뭉칩니다. 어깨와 이마는
        밝은 돌빛, 몸통은 중간, 머리는 어둡게 — 세 값을 확실히 벌립니다.
     4. 밝은 점 한 쌍은 눈에만. 어깨에 밝은 못을 박았더니 머리가 둘로 보였습니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="34" viewBox="0 0 32 34">
  <defs>
    <radialGradient id="eyeglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb74d" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffb74d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="#241410" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">

    <!-- ── 뒤쪽 팔 — 가장 어둡게. 몸 뒤에 있다는 것은 값으로만 말합니다 ── -->
    <path d="M8 16 q-4.4 6 -3 11.6 q2.6 2.4 5.2 -0.4 q-2 -5.6 1 -10.6 z" fill="#3e2723"/>
    <ellipse cx="6.6" cy="28.4" rx="3.2" ry="2.8" fill="#4e342e"/>

    <!-- ── 짧은 다리 — 덩치에 눌린 듯 뭉툭하게 ── -->
    <path d="M9 25 q-1.6 5 -0.4 8 h5.6 q1 -4 -0.2 -8 z" fill="#4e342e"/>
    <path d="M16.6 25.6 q-1.6 5 -0.4 7.4 h5.6 q1 -3.6 -0.2 -7.4 z" fill="#6d4c41"/>
    <path d="M17.6 26.6 q1.6 -0.4 2.6 0 q0.4 2.6 0 5.4 q-1.4 0.4 -2.6 0 z" fill="#8d6e63" stroke="none"/>
    <path d="M8.6 30 q3 1.2 5.6 0 M16.2 30.4 q3 1.2 5.6 0" fill="none" stroke="#546e7a" stroke-width="1.2"/>

    <!-- ── 몸통 — 등이 왼쪽 위로 부풀고 앞이 낮게 기웁니다 ── -->
    <path d="M5 20 q-1.4 -9.4 7.4 -11.6 q8.4 -2 12.6 4.4 q2.6 4.4 0.6 11
             q-2.4 4.6 -10.6 4.6 q-8.6 0 -10 -8.4 z" fill="#6d4c41"/>
    <!-- 어두운 면 — 오른쪽 아래 -->
    <path d="M20 11.6 q6 3 5.6 9.4 q-0.4 6.4 -8.6 7.4 q5.4 -8.4 3 -16.8 z" fill="#4e342e" stroke="none"/>
    <!-- 등의 밝은 면 — 왼쪽 위 -->
    <path d="M6.4 19 q-1 -8 7 -10 q-5 3.6 -4.8 10.4 z" fill="#8d6e63" stroke="none"/>

    <!-- ── 가슴판 — V 자로 덮습니다 ── -->
    <path d="M10.6 17.6 q7 -3.4 13 1.4 l-1.6 4.4 q-5 -3.8 -10.6 -1.4 z" fill="#4e342e"/>
    <path d="M11.2 18.2 q6.4 -2.6 12 1.2" fill="none" stroke="#8d6e63" stroke-width="0.8"/>
    <circle cx="13.4" cy="21.2" r="1" fill="#546e7a"/>
    <circle cx="17.6" cy="20.4" r="1" fill="#546e7a"/>
    <circle cx="21.4" cy="21.8" r="1" fill="#546e7a"/>

    <!-- ── 어깨판 — 돌빛으로 밝게. 몸통과 값이 갈려야 갑옷으로 읽힙니다.
         모서리를 각지게만 두면 얹어 놓은 상자가 되므로 어깨선을 따라 휩니다 ── -->
    <!-- 몸통보다 밝되 이마보다는 어둡게. 가장 밝은 자리는 눈이 있는 머리에 줍니다 -->
    <path d="M4.6 15.6 q-1 -7 5 -9.2 q6 -2 8.4 4.4 q-1 3.4 -3.4 4 q-5.4 -1.6 -10 0.8 z"
          fill="#a1887f"/>
    <path d="M6.4 13.6 q-0.6 -5 4.4 -6.4 q-3.4 2.6 -3 6.6 z" fill="#7d6259" stroke="none"/>
    <circle cx="9.6" cy="10.6" r="0.9" fill="#546e7a"/>
    <circle cx="13" cy="10.4" r="0.9" fill="#546e7a"/>
    <path d="M5 14.6 q-0.8 -6.4 4.8 -8.4" fill="none" stroke="#efebe9" stroke-opacity=".55" stroke-width="1"/>

    <!-- ── 머리 — 오른쪽으로 쑥 내밉니다. 어둡게 두고 눈만 켭니다 ── -->
    <path d="M19 13 q3.4 -3.6 8 -2.4 q4.6 1.2 4.4 5.4 q-0.2 4.4 -5 5.4
             q-5 1 -7.4 -2.6 z" fill="#5d4037"/>
    <!-- 이마 — 돌빛 눈두덩. 어깨판과 같은 값이라 하나의 갑옷으로 묶입니다 -->
    <path d="M19.6 13.4 q4 -3.4 8.6 -2 q2.6 0.8 3 3 q-5.4 -2.6 -11.6 0.4 z" fill="#bcaaa4"/>
    <!-- 짧은 뿔 -->
    <path d="M22.6 10.6 q-1 -3.6 1.6 -4.2 q0.8 2.2 0.2 4.2 z" fill="#d7ccc8" stroke-width="1.1"/>
    <path d="M28.6 12 q2.4 -2.6 4 -0.6 q-2.4 0.8 -3 2.4 z" fill="#d7ccc8" stroke-width="1.1"/>
    <!-- 눈구멍 — 어둡게 파고 그 안에서만 빛냅니다 -->
    <path d="M20 15.4 q5.4 -2.6 10 -0.4 q0 2.6 -1 3.2 q-4.6 1.6 -8.4 0 z" fill="#1a0f0c"/>
    <ellipse cx="23" cy="16.6" rx="2.8" ry="2.4" fill="url(#eyeglow)" stroke="none"/>
    <ellipse cx="27.4" cy="16.6" rx="2.8" ry="2.4" fill="url(#eyeglow)" stroke="none"/>
    <ellipse cx="23" cy="16.6" rx="1.5" ry="1.2" fill="#ffe0b2" stroke="none"/>
    <ellipse cx="27.4" cy="16.6" rx="1.5" ry="1.2" fill="#ffe0b2" stroke="none"/>
    <!-- 아래턱에 삐져나온 엄니 -->
    <path d="M22.6 20.4 q0.4 2.4 -1.4 3 q-0.6 -1.6 -0.4 -3.2 z" fill="#efebe9" stroke-width="1.1"/>

    <!-- ── 앞쪽 팔 — 밝게, 앞으로. 몸통과 사이에 선이 보여야 떨어져 보입니다 ── -->
    <path d="M21.6 22.6 q5.4 3.4 5 8.6 q-3 2.4 -5.8 -0.6 q1 -4 -2.6 -6.6 z" fill="#8d6e63"/>
    <path d="M22 24 q3 2.6 3.2 5.6 q-2.2 -3 -4 -4.6 z" fill="#a1887f" stroke="none"/>
    <ellipse cx="24.2" cy="30.4" rx="4" ry="3.4" fill="#a1887f"/>
    <path d="M21.4 29 q2.8 -1.6 5.6 -0.4" fill="none" stroke-width="1"/>
    <path d="M22 31.8 q2.6 1.4 5 0.4" fill="none" stroke-width="1"/>
  </g>
</svg>
