<!-- 방어구 (전사) 36×36 · 방패 · 강철 #A8BCCD + 금테 #FFC94D
     처음에 견갑(둥근 판 셋)으로 그렸더니 36px 에서 헬멧으로 읽혔습니다.
     규격이 "견갑/방패 조각"이므로 방패로 갑니다 — 위가 넓고 아래가 뾰족한
     실루엣은 이 아이템 하나뿐이라 멀리서도 안 헷갈립니다.

     궁수 것(item-armor-archer)과 **경로가 한 글자도 다르지 않습니다.** 칠만
     바뀝니다. 같은 「방」인데 그림이 같으면 내 것이라는 느낌이 없고,
     모양까지 다르면 같은 아이템으로 안 읽힙니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <g stroke="#131826" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M18 2 q9 3.4 15 3.4 q1 16 -5 24 q-4.4 5.6 -10 6.4 q-5.6 -0.8 -10 -6.4
             q-6 -8 -5 -24 q6 0 15 -3.4 z" fill="#7d93a8"/>
    <path d="M18 4.6 q7.4 2.8 12.4 3 q0.8 14 -4.2 21 q-3.4 4.6 -8.2 5.4 z"
          fill="#90a4ae" stroke="none"/>
    <path d="M18 4.6 q-7.4 2.8 -12.4 3 q-0.8 14 4.2 21 q3.4 4.6 8.2 5.4 z"
          fill="#a8bccd" stroke="none"/>
    <path d="M7.6 8.6 q4.6 -0.6 9 -2.4" fill="none"
          stroke="#dbe6f0" stroke-opacity=".85" stroke-width="1.6"/>
    <!-- 금테 -->
    <path d="M18 2 q9 3.4 15 3.4 q1 16 -5 24 q-4.4 5.6 -10 6.4 q-5.6 -0.8 -10 -6.4
             q-6 -8 -5 -24 q6 0 15 -3.4 z" fill="none" stroke="#ffc94d" stroke-width="1.5"/>
    <!-- 가운데 돌기 -->
    <circle cx="18" cy="16.4" r="4.6" fill="#ffc94d"/>
    <circle cx="18" cy="16.4" r="1.8" fill="#8d6208" stroke="none"/>
    <path d="M18 21 L18 30" fill="none" stroke="#5f778f" stroke-width="1.4"/>
  </g>
</svg>
