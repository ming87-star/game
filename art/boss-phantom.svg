<!-- 갈라진 가면 320×240 · 사라졌다 다른 자리에 나타납니다
     넷은 자리를 지키고 이놈만 자리를 옮깁니다. 그래서 몸을 반투명하게 두고
     아래를 연기처럼 풀었습니다 — 붙잡을 데가 없어 보여야 합니다.

     ART.md 의 규칙 하나가 여기 걸립니다. 어두운 놈은 배경(#1d2542)에 묻히므로
     **밝은 테두리**를 둘러야 합니다. 그래서 이놈만 외곽선이 어둡지 않고
     창백한 흰보라(#e1bee7)입니다. 가면의 세로 금이 갈라져 있을수록 곧 사라집니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240"
     data-bake-scale="2">
  <defs>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5e35b1" stop-opacity=".92"/>
      <stop offset="55%"  stop-color="#4527a0" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#311b92" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f3e5f5"/>
      <stop offset="60%"  stop-color="#d6bde0"/>
      <stop offset="100%" stop-color="#9c7bb0"/>
    </linearGradient>
    <radialGradient id="slit" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#e1bee7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── 몸 — 반투명. 아래로 갈수록 풀립니다 ── -->
  <g stroke="#e1bee7" stroke-opacity=".55" stroke-width="3"
     stroke-linejoin="round" stroke-linecap="round">
    <path d="M30 116 q0 -72 74 -80 q56 -6 112 0 q74 8 74 80 q0 44 -30 62
             q-16 -22 -34 -8 q-14 -20 -32 -6 q-16 -22 -34 -6 q-18 -16 -34 4
             q-18 -18 -34 4 q-30 -20 -30 -50 z" fill="url(#veil)"/>
  </g>

  <!-- 아래로 흩어지는 자락 — 선을 끊어 그려야 연기로 보입니다 -->
  <g stroke="#e1bee7" stroke-opacity=".3" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M74 186 q-6 22 4 40"/>
    <path d="M116 198 q-8 20 0 36"/>
    <path d="M160 204 q6 20 -2 34"/>
    <path d="M204 198 q10 20 2 34"/>
    <path d="M246 186 q8 22 -2 40"/>
  </g>

  <g stroke="#3a1f70" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">

    <!-- ── 뿔 — 가면에서 자라난 것처럼 가늘고 길게 ── -->
    <path d="M92 62 L62 4 L118 46 z"   fill="#4527a0" opacity=".9"/>
    <path d="M228 62 L258 4 L202 46 z" fill="#4527a0" opacity=".9"/>

    <!-- ── 가면 — 이놈의 전부. 몸보다 훨씬 밝아 여기만 또렷합니다 ── -->
    <path d="M104 62 q56 -14 112 0 q10 62 -14 104 q-42 24 -84 0 q-24 -42 -14 -104 z"
          fill="url(#mask)"/>
    <!-- 세로로 갈라진 금 -->
    <path d="M160 50 L152 96 L166 124 L156 168" fill="none" stroke="#4a2a63" stroke-width="4"/>
    <path d="M152 96 L134 88 M166 124 L184 118" fill="none" stroke="#4a2a63" stroke-width="2.6"/>
    <!-- 금 사이로 새는 빛 -->
    <path d="M160 54 L153 96 L165 122 L157 164" fill="none"
          stroke="#ffffff" stroke-opacity=".5" stroke-width="1.6"/>
    <!-- 갈라져 어긋난 왼쪽 조각 -->
    <path d="M104 62 q28 -7 54 -9 l-6 43 l-38 -6 z" fill="#f3e5f5" stroke="none" opacity=".55"/>

    <!-- ── 눈 — 구멍입니다. 눈알이 없어야 사람이 아닌 것으로 읽힙니다 ── -->
    <ellipse cx="132" cy="106" rx="26" ry="20" fill="url(#slit)" stroke="none"/>
    <ellipse cx="190" cy="106" rx="26" ry="20" fill="url(#slit)" stroke="none"/>
    <path d="M116 100 q18 -12 34 2 q-16 12 -34 -2 z" fill="#2b1245" stroke-width="2.6"/>
    <path d="M206 100 q-18 -12 -34 2 q16 12 34 -2 z" fill="#2b1245" stroke-width="2.6"/>
    <ellipse cx="133" cy="101" rx="7" ry="4" fill="#ffffff" opacity=".9" stroke="none"/>
    <ellipse cx="189" cy="101" rx="7" ry="4" fill="#ffffff" opacity=".9" stroke="none"/>

    <!-- ── 입 — 꿰맨 자국. 이빨 대신 이것이 아래턱 자리를 잡습니다 ── -->
    <path d="M126 140 q34 12 68 0" fill="none" stroke="#4a2a63" stroke-width="3.4"/>
    <g stroke="#4a2a63" stroke-width="2.4" fill="none">
      <path d="M138 137 L134 148"/><path d="M152 142 L150 153"/>
      <path d="M168 142 L170 153"/><path d="M182 137 L186 148"/>
    </g>
  </g>
</svg>
